<script>
/* Playable-ad runtime shared by every game.
 *
 * Design space is 540x960 (the games' Godot viewport) with "expand" aspect:
 * the 540x960 safe area is centred and the visible area (PA.view) grows on
 * whichever axis the screen has extra room. Games draw in design units.
 *
 * A game registers itself with PA.register({ init, update, draw, down, move,
 * up, drawEndBg, debug }) and calls PA.win() when the payoff moment is done.
 * The runtime owns: canvas sizing, input, fonts/images/sounds, the persistent
 * INSTALL pill, the tutorial hand, popups/particles, the end card and the
 * network adapter (MRAID / Google ExitApi / local preview).
 */
(function () {
  'use strict';
  var CFG = window.PA_CFG || {};
  var AS = window.PA_ASSETS || { img: {}, snd: {} };
  var NET = CFG.net || 'preview';
  var THEME = CFG.theme || {};
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  var PA = (window.PA = {
    W: 540, H: 960, ctx: ctx, cfg: CFG, theme: THEME, net: NET,
    t: 0, img: {}, view: { x: 0, y: 0, w: 540, h: 960 },
    scale: 1, ox: 0, oy: 0, cssScale: 1,
    hand: null, started: false, ended: false, paused: false, interacted: false,
    DISPLAY: '"PA Display", "Arial Black", Impact, sans-serif',
    TEXT: '"PA Text", "Avenir Next", "Segoe UI", Roboto, Arial, sans-serif',
    HEAVY: '"PA Heavy", "PA Text", "Arial Black", sans-serif',
  });
  var game = null;

  // ---------------------------------------------------------------- utils
  PA.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  PA.lerp = function (a, b, t) { return a + (b - a) * t; };
  PA.rand = function (a, b) { return a + Math.random() * (b - a); };
  PA.ease = {
    outCubic: function (t) { t = PA.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); },
    inOutSine: function (t) { t = PA.clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { t = PA.clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: function (t) { t = PA.clamp(t, 0, 1); if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; },
  };
  PA.rr = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  PA.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['', 'K', 'M', 'B', 'T'], i = 0, v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.0+$/, '') + u[i];
  };
  // Draw an image to cover a rect (like CSS background-size: cover).
  // ax/ay pick which part survives the crop (0.5 = centre).
  PA.cover = function (c, im, x, y, w, h, ax, ay) {
    if (!im || !im.width) return;
    ax = ax == null ? 0.5 : ax; ay = ay == null ? 0.5 : ay;
    var s = Math.max(w / im.width, h / im.height);
    var dw = im.width * s, dh = im.height * s;
    c.drawImage(im, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
  };

  // Text with a chunky outline, the way the games style labels.
  PA.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var size = o.size || 32;
    var font = o.font || PA.HEAVY;
    c.save();
    c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font;
    if (o.maxW) {
      var w = c.measureText(str).width;
      if (w > o.maxW) { size = Math.floor(size * o.maxW / w); c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font; }
    }
    c.textAlign = o.align || 'center';
    c.textBaseline = o.base || 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    if (o.shadow) {
      c.fillStyle = o.shadow;
      if (o.stroke) { c.strokeStyle = o.shadow; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y + (o.shadowY || size * 0.09)); }
      c.fillText(str, x, y + (o.shadowY || size * 0.09));
    }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y); }
    if (o.grad) {
      var g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, o.grad[0]); g.addColorStop(1, o.grad[1]);
      c.fillStyle = g;
    } else c.fillStyle = o.color || '#fff';
    c.fillText(str, x, y);
    c.restore();
    return size;
  };

  // Chunky mobile-game button with a darker bottom lip.
  PA.button = function (x, y, w, h, label, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var press = o.press || 0;
    var lip = o.lip == null ? Math.round(h * 0.1) : o.lip;
    var r = o.r == null ? h * 0.28 : o.r;
    c.save();
    c.translate(x, y);
    if (o.scale) c.scale(o.scale, o.scale);
    var top = -h / 2 + press * lip;
    if (o.glow) {
      c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30;
    }
    c.fillStyle = o.lipColor || 'rgba(0,0,0,0.35)';
    PA.rr(c, -w / 2, -h / 2 + lip, w, h, r); c.fill();
    c.shadowBlur = 0;
    if (o.edge) {
      c.fillStyle = o.edge;
      PA.rr(c, -w / 2, top, w, h, r); c.fill();
    }
    var bw = o.edge ? (o.edgeW || 4) : 0;
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, o.top || o.fill || '#e07a35');
    g.addColorStop(1, o.fill || '#c85f22');
    c.fillStyle = g;
    PA.rr(c, -w / 2 + bw, top + bw, w - bw * 2, h - bw * 2, r - bw); c.fill();
    // gloss
    c.globalAlpha = 0.22;
    c.fillStyle = '#fff';
    PA.rr(c, -w / 2 + bw + 8, top + bw + 5, w - bw * 2 - 16, (h - bw * 2) * 0.36, (r - bw) * 0.8); c.fill();
    c.globalAlpha = 1;
    PA.text(label, 0, top + h / 2 + (o.textDy || 1), {
      ctx: c, size: o.size || h * 0.42, font: o.font || PA.HEAVY, color: o.color || '#fff',
      stroke: o.textStroke, strokeW: o.textStrokeW, shadow: o.textShadow === false ? null : (o.textShadow || 'rgba(0,0,0,0.25)'),
      shadowY: 2, maxW: w - 36,
    });
    c.restore();
  };

  // ---------------------------------------------------------------- fx
  var pops = [], parts = [], flyers = [];
  // Floating label: rises, pops in, fades.
  PA.pop = function (str, x, y, o) {
    o = o || {};
    pops.push({ s: str, x: x, y: y, t: 0, life: o.life || 0.9, size: o.size || 36, color: o.color || '#fff',
      stroke: o.stroke || 'rgba(0,0,0,0.85)', font: o.font || PA.HEAVY, rise: o.rise == null ? 70 : o.rise, grad: o.grad });
  };
  // Particle burst. o.shape: 'circle' | 'rect' | 'star' | function(c, p)
  PA.burst = function (x, y, n, o) {
    o = o || {};
    var cols = o.colors || ['#fff'];
    for (var i = 0; i < n; i++) {
      var a = o.angle != null ? o.angle + PA.rand(-o.spread, o.spread) : PA.rand(0, Math.PI * 2);
      var sp = PA.rand(o.speedMin || 120, o.speed || 420);
      parts.push({ x: x + PA.rand(-(o.jitter || 0), o.jitter || 0), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.gravity == null ? 900 : o.gravity, drag: o.drag || 0, t: 0, life: PA.rand((o.life || 0.9) * 0.7, o.life || 0.9),
        size: PA.rand(o.sizeMin || 4, o.size || 10), grow: o.grow || 0, color: cols[(Math.random() * cols.length) | 0],
        rot: PA.rand(0, 6.28), vr: PA.rand(-10, 10), shape: o.shape || 'circle', fade: o.fade !== false });
    }
  };
  // Something flies from A to B on an arc, then onArrive fires.
  PA.fly = function (x0, y0, x1, y1, o) {
    o = o || {};
    flyers.push({ x0: x0, y0: y0, x1: x1, y1: y1, t: -(o.delay || 0), dur: o.dur || 0.6, draw: o.draw,
      arc: o.arc == null ? -120 : o.arc, cb: o.onArrive, size: o.size || 1 });
  };
  function star(c, r) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  }
  PA.star = star;
  function updFx(dt) {
    var i;
    for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > pops[i].life) pops.splice(i, 1); }
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t > p.life) { parts.splice(i, 1); continue; }
      if (p.drag) { var d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.size += p.grow * dt;
    }
    for (i = flyers.length - 1; i >= 0; i--) {
      var f = flyers[i];
      f.t += dt;
      if (f.t >= f.dur) { flyers.splice(i, 1); if (f.cb) f.cb(); }
    }
  }
  function drawFx(c) {
    var i;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i], k = p.t / p.life;
      c.save();
      c.globalAlpha = p.fade ? 1 - k * k : 1;
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      if (typeof p.shape === 'function') p.shape(c, p);
      else if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === 'star') { star(c, p.size); c.fill(); }
      else { c.beginPath(); c.arc(0, 0, p.size, 0, 6.283); c.fill(); }
      c.restore();
    }
    for (i = 0; i < flyers.length; i++) {
      var f = flyers[i];
      if (f.t < 0) continue;
      var u = PA.ease.inOutSine(f.t / f.dur);
      var x = PA.lerp(f.x0, f.x1, u), y = PA.lerp(f.y0, f.y1, u) + f.arc * Math.sin(Math.PI * u);
      if (f.draw) f.draw(c, x, y, u);
    }
    for (i = 0; i < pops.length; i++) {
      var q = pops[i], k2 = q.t / q.life;
      var sc = k2 < 0.15 ? PA.ease.outBack(k2 / 0.15) : 1;
      c.save();
      c.translate(q.x, q.y - q.rise * PA.ease.outCubic(k2));
      c.scale(sc, sc);
      PA.text(q.s, 0, 0, { ctx: c, size: q.size, font: q.font, color: q.color, grad: q.grad, stroke: q.stroke,
        alpha: k2 > 0.7 ? 1 - (k2 - 0.7) / 0.3 : 1 });
      c.restore();
    }
  }

  // Subtle touch cue: no cursor glove obscuring the game. The existing
  // hand coordinates animate the touch point along the demonstrated drag.
  PA.drawHand = function (x, y, o) {
    o = o || {};
    var c = ctx, pulse = (PA.t * 1.4) % 1, r = (o.press ? 13 : 17) * (o.scale || 1);
    c.save();
    c.globalAlpha = o.alpha == null ? 0.85 : o.alpha * 0.85;
    c.fillStyle = 'rgba(255,255,255,0.28)';
    c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 3;
    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.stroke();
    c.globalAlpha *= 1 - pulse;
    c.lineWidth = 2;
    c.beginPath(); c.arc(x, y, r + 5 + pulse * 22, 0, Math.PI * 2); c.stroke();
    c.restore();
  };

  // ---------------------------------------------------------------- audio
  var actx = null, sounds = {}, muted = true;
  function b64ToBuf(b64) {
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  function unlockAudio() {
    if (actx) { if (actx.state === 'suspended' && actx.resume) actx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (e) { return; }
    muted = false;
    // iOS needs a sound started inside the gesture to unlock output.
    try { var b = actx.createBuffer(1, 1, 22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0); } catch (e) {}
    Object.keys(AS.snd || {}).forEach(function (k) {
      try {
        var p = actx.decodeAudioData(b64ToBuf(AS.snd[k]), function (buf) { sounds[k] = buf; }, function () {});
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    });
  }
  PA.sfx = function (name, vol, rate) {
    if (muted || !actx || !sounds[name] || PA.paused) return;
    try {
      var s = actx.createBufferSource(), g = actx.createGain();
      s.buffer = sounds[name];
      if (rate) s.playbackRate.value = rate;
      g.gain.value = vol == null ? 0.7 : vol;
      s.connect(g); g.connect(actx.destination);
      s.start(0);
    } catch (e) {}
  };

  // ---------------------------------------------------------------- network / CTA
  PA.isIOS = function () {
    // The review page can exercise either store CTA without changing the device.
    if (NET === 'preview') {
      var platform = new URLSearchParams(location.search).get('platform');
      if (platform === 'ios' || platform === 'android') return platform === 'ios';
    }
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  };
  PA.storeUrl = function () {
    return PA.isIOS() ? 'https://apps.apple.com/app/id' + CFG.ios : 'https://play.google.com/store/apps/details?id=' + CFG.android;
  };
  var toast = null;
  window.__ctaLog = [];
  PA.cta = function () {
    PA.sfx('click', 0.6);
    var url = PA.storeUrl();
    window.__ctaLog.push({ net: NET, url: url, t: +PA.t.toFixed(2) });
    try {
      if (NET === 'mraid') {
        if (window.mraid && typeof mraid.open === 'function') mraid.open(url);
        else window.open(url, '_blank');
      } else if (NET === 'google') {
        if (window.ExitApi && typeof ExitApi.exit === 'function') ExitApi.exit();
        else window.open(url, '_blank');
      } else {
        // Local preview: log the target instead of leaving the page.
        console.log('[CTA] ' + url);
        toast = { s: 'CTA → ' + url.replace('https://', ''), t: 0 };
      }
    } catch (e) {}
  };

  // ---------------------------------------------------------------- layout
  var cssW = 0, cssH = 0;
  function measure() {
    var w = window.innerWidth || document.documentElement.clientWidth || 320;
    var h = window.innerHeight || document.documentElement.clientHeight || 480;
    if (w === cssW && h === cssH) return;
    cssW = w; cssH = h;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(w * dpr));
    cv.height = Math.max(1, Math.round(h * dpr));
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    var s = Math.min(w / 540, h / 960);
    PA.cssScale = s;
    PA.scale = s * dpr;
    PA.ox = (w / s - 540) / 2;
    PA.oy = (h / s - 960) / 2;
    PA.view = { x: -PA.ox, y: -PA.oy, w: w / s, h: h / s };
    PA.landscape = w > h * 1.05;
    if (game && game.resize) game.resize(PA.view);
  }
  PA.toScreen = function (x, y) { return { x: (x + PA.ox) * PA.cssScale, y: (y + PA.oy) * PA.cssScale }; };
  function toDesign(cx, cy) {
    var r = cv.getBoundingClientRect();
    return { x: (cx - r.left) / PA.cssScale - PA.ox, y: (cy - r.top) / PA.cssScale - PA.oy };
  }

  // ---------------------------------------------------------------- install pill
  function pillRect() {
    var v = PA.view, w = 128, h = 46;
    return { x: v.x + v.w - w / 2 - 14, y: v.y + h / 2 + 14, w: w, h: h };
  }
  function inRect(p, r, pad) {
    pad = pad || 0;
    return Math.abs(p.x - r.x) <= r.w / 2 + pad && Math.abs(p.y - r.y) <= r.h / 2 + pad;
  }
  function drawPill() {
    var r = pillRect();
    PA.button(r.x, r.y, r.w, r.h, THEME.pillLabel || 'INSTALL', {
      fill: THEME.cta || '#d9732f', top: THEME.ctaTop || THEME.cta, edge: THEME.ctaEdge, edgeW: 3, size: 20,
      color: THEME.ctaText || '#fff', r: 23, lip: 4, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: 1 + 0.04 * Math.sin(PA.t * 4),
    });
  }

  // ---------------------------------------------------------------- end card
  var endT = 0, triggered = false;
  // Called by the game when the payoff is done; the end card follows `delay` s later.
  PA.win = function (delay) {
    if (triggered) return;
    triggered = true;
    endT = -(delay == null ? 1.2 : delay);
  };
  PA.showEnd = function () { PA.win(0); };
  function endButton() { return { x: 270, y: 480 + 236, w: 380, h: 104 }; }
  function drawEnd(dt) {
    endT += dt;
    if (endT < 0) return;
    if (!PA.ended) {
      Object.keys(activePointers).forEach(function(key){onCancel({pointerId:activePointers[key]});});
      PA.ended = true; PA.hand = null; if (game && game.onEnd) game.onEnd();
    }
    var c = ctx, v = PA.view, k = PA.ease.outCubic(endT / 0.45);
    c.save();
    if (game && game.drawEndBg) { c.globalAlpha = k; game.drawEndBg(c, v); c.globalAlpha = 1; }
    var g = c.createLinearGradient(0, v.y, 0, v.y + v.h);
    g.addColorStop(0, THEME.endTop || 'rgba(20,10,4,0.55)');
    g.addColorStop(0.5, THEME.endMid || 'rgba(20,10,4,0.72)');
    g.addColorStop(1, THEME.endBot || 'rgba(20,10,4,0.9)');
    c.globalAlpha = k;
    c.fillStyle = g; c.fillRect(v.x, v.y, v.w, v.h);
    // sun-ray glow behind the icon
    var cy = 480 - 190;
    c.save();
    c.translate(270, cy);
    c.rotate(PA.t * 0.25);
    c.fillStyle = THEME.rays || 'rgba(255,214,110,0.10)';
    for (var i = 0; i < 12; i++) { c.rotate(Math.PI / 6); c.beginPath(); c.moveTo(0, 0); c.lineTo(-60, -520); c.lineTo(60, -520); c.closePath(); c.fill(); }
    c.restore();
    var rg = c.createRadialGradient(270, cy, 20, 270, cy, 260);
    rg.addColorStop(0, THEME.glow || 'rgba(255,200,90,0.45)'); rg.addColorStop(1, 'rgba(255,200,90,0)');
    c.fillStyle = rg; c.fillRect(270 - 260, cy - 260, 520, 520);
    c.globalAlpha = 1;

    // icon
    var ik = PA.ease.outBack(endT / 0.55), isz = 206;
    var im = PA.img.icon;
    c.save();
    c.translate(270, cy + 8 * Math.sin(PA.t * 2));
    c.scale(ik, ik);
    c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = 30; c.shadowOffsetY = 12;
    c.fillStyle = THEME.iconEdge || '#f2c35a';
    PA.rr(c, -isz / 2 - 6, -isz / 2 - 6, isz + 12, isz + 12, 52); c.fill();
    c.shadowColor = 'transparent';
    c.save();
    PA.rr(c, -isz / 2, -isz / 2, isz, isz, 46); c.clip();
    if (im && im.width) c.drawImage(im, -isz / 2, -isz / 2, isz, isz);
    c.restore();
    c.restore();

    // name + pitch
    var tk = PA.ease.outCubic((endT - 0.2) / 0.4);
    c.globalAlpha = tk;
    var ny = 480 + 18 + (1 - tk) * 30;
    if (game && game.drawEndTitle) game.drawEndTitle(c, 270, ny);
    else PA.text(CFG.name, 270, ny, { size: 64, font: PA.DISPLAY, color: THEME.title || '#f8d456', stroke: THEME.titleStroke || '#331709', strokeW: 12, shadow: 'rgba(0,0,0,0.45)', shadowY: 6, maxW: 500 });
    wrapText(CFG.pitch, 270, ny + (THEME.pitchDy || 74), 470, 28, { size: 25, font: PA.TEXT, color: THEME.pitch || '#fbefd6', stroke: 'rgba(0,0,0,0.55)', strokeW: 6 });
    // button
    var b = endButton();
    var bk = PA.ease.outBack((endT - 0.4) / 0.45);
    if (endT > 0.4) {
      PA.button(b.x, b.y, b.w, b.h, THEME.ctaLabel || 'PLAY FREE', {
        fill: THEME.cta || '#d9732f', top: THEME.ctaTop || THEME.cta, edge: THEME.ctaEdge, edgeW: 5,
        color: THEME.ctaText || '#fff', size: 46, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: bk * (1 + 0.05 * Math.sin(PA.t * 5.5)),
        glow: THEME.ctaGlow || 'rgba(255,190,80,0.6)', glowBlur: 34,
      });
      // a hand nudging the button
      PA.drawHand(b.x + 120, b.y + 40 + 10 * Math.abs(Math.sin(PA.t * 3)), { scale: 0.9, alpha: PA.clamp((endT - 1.2) * 2, 0, 1), press: Math.sin(PA.t * 3) > 0.7 });
    }
    c.restore();
  }
  function wrapText(str, x, y, maxW, lh, o) {
    if (!str) return;
    ctx.save();
    ctx.font = o.size + 'px ' + o.font;
    var words = str.split(' '), line = '', lines = [];
    for (var i = 0; i < words.length; i++) {
      var t = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = words[i]; } else line = t;
    }
    lines.push(line);
    ctx.restore();
    for (var j = 0; j < lines.length; j++) PA.text(lines[j], x, y + j * (lh + 6), o);
  }
  PA.wrapText = wrapText;

  // ---------------------------------------------------------------- input
  var activePointers = {};
  var adViewable = true;
  function onCancel(e) {
    var id = e.pointerId == null ? 'm' : e.pointerId;
    if (!Object.prototype.hasOwnProperty.call(activePointers, id)) return;
    delete activePointers[id];
    if (game && game.cancel) game.cancel(id);
  }
  function syncPause() {
    PA.paused = document.hidden || !adViewable;
    if (PA.paused) Object.keys(activePointers).forEach(function (key) {
      onCancel({ pointerId: activePointers[key] });
    });
    else last = 0;
  }
  function onDown(e) {
    if (e.cancelable) e.preventDefault();
    var p = toDesign(e.clientX, e.clientY);
    unlockAudio();
    PA.interacted = true;
    if (!PA.started || PA.paused) return;
    if (PA.ended) {
      if (inRect(p, endButton())) PA.cta();
      return;
    }
    if (inRect(p, pillRect(), 8)) { PA.cta(); return; }
    var id = e.pointerId == null ? 'm' : e.pointerId;
    activePointers[id] = id;
    if (game && game.down) game.down(p.x, p.y, id);
  }
  function onMove(e) {
    var id = e.pointerId == null ? 'm' : e.pointerId;
    if (!Object.prototype.hasOwnProperty.call(activePointers,id) || PA.ended) return;
    if (e.cancelable) e.preventDefault();
    var p = toDesign(e.clientX, e.clientY);
    if (game && game.move) game.move(p.x, p.y, id);
  }
  function onUp(e) {
    var id = e.pointerId == null ? 'm' : e.pointerId;
    if (!Object.prototype.hasOwnProperty.call(activePointers,id)) return;
    delete activePointers[id];
    if (PA.ended) return;
    var p = toDesign(e.clientX, e.clientY);
    if (game && game.up) game.up(p.x, p.y, id);
  }
  if (window.PointerEvent) {
    cv.addEventListener('pointerdown', onDown, { passive: false });
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onCancel);
  } else {
    var T = function (fn) {
      return function (e) {
        if (e.cancelable) e.preventDefault();
        for (var i = 0; i < e.changedTouches.length; i++) {
          var t = e.changedTouches[i];
          fn({ clientX: t.clientX, clientY: t.clientY, pointerId: 't' + t.identifier });
        }
      };
    };
    cv.addEventListener('touchstart', T(onDown), { passive: false });
    cv.addEventListener('touchmove', T(onMove), { passive: false });
    cv.addEventListener('touchend', T(onUp));
    cv.addEventListener('touchcancel', T(onCancel));
    cv.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------------------------------------------------------------- loop
  var last = 0, playT = 0;
  PA.MAX_PLAY = CFG.maxPlay || 60;   // safety net: end card no matter what
  function frame(now) {
    requestAnimationFrame(frame);
    measure();
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
    last = now;
    if (PA.paused) dt = 0;
    PA.dt = dt;
    PA.t += dt;
    if (PA.started && !PA.ended) {
      playT += dt;
      if (playT > PA.MAX_PLAY) PA.win(0);
    }
    var live = game && PA.started;   // nothing game-side runs before init()
    if (live && game.update && !PA.ended) game.update(dt);
    updFx(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = THEME.bg || '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.setTransform(PA.scale, 0, 0, PA.scale, PA.ox * PA.scale, PA.oy * PA.scale);
    ctx.imageSmoothingEnabled = true;
    if (live && game.draw) game.draw(ctx, PA.view);
    drawFx(ctx);
    if (PA.hand && !PA.ended) PA.drawHand(PA.hand.x, PA.hand.y, PA.hand);
    if (triggered) drawEnd(dt);
    if (!PA.ended && PA.started) drawPill();
    if (toast) {
      toast.t += dt;
      var v = PA.view;
      ctx.save();
      ctx.globalAlpha = PA.clamp(3 - toast.t, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      PA.rr(ctx, v.x + 14, v.y + v.h - 70, v.w - 28, 50, 12); ctx.fill();
      PA.text(toast.s, v.x + v.w / 2, v.y + v.h - 45, { size: 17, font: PA.TEXT, color: '#9f9', maxW: v.w - 50 });
      ctx.restore();
      if (toast.t > 3) toast = null;
    }
  }

  // ---------------------------------------------------------------- boot
  PA.register = function (g) { game = g; tryStart(); };
  PA.inspect = function () { return game && game.inspect ? game.inspect() : null; };
  var ready = { fonts: false, imgs: false, net: false }, booted = false;
  function tryStart() {
    if (booted || !ready.imgs || !ready.fonts || !ready.net || !game) return;
    booted = true;
    measure();
    if (game.init) game.init();
    PA.started = true;
    if (CFG.debug && game.debug) {
      var m = /stage=(\w+)/.exec(location.hash);
      if (m) game.debug(m[1]);
      if (/end/.test(location.hash)) PA.win(0);
    }
  }
  function imagesLoaded() { ready.imgs = true; tryStart(); }
  var keys = Object.keys(AS.img || {}), left = keys.length;
  if (!left) ready.imgs = true;
  keys.forEach(function (k) {
    var im = new Image();
    im.onload = im.onerror = function () { if (--left === 0) imagesLoaded(); };
    im.src = AS.img[k];
    PA.img[k] = im;
  });
  setTimeout(function () { if (!ready.imgs) imagesLoaded(); }, 900);
  // Fonts are inline data URIs; ask the browser to load them, cap the wait.
  function fontsDone() { if (!ready.fonts) { ready.fonts = true; tryStart(); } }
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('40px "PA Display"'), document.fonts.load('40px "PA Text"'), document.fonts.load('40px "PA Heavy"'),
    ]).then(fontsDone, fontsDone);
    setTimeout(fontsDone, 700);
  } else fontsDone();

  // Network readiness: MRAID waits for `ready` and a viewable container.
  function netReady() { if (!ready.net) { ready.net = true; tryStart(); } }
  if (NET === 'mraid' && window.mraid) {
    var onViewable = function (v) { adViewable = !!v; syncPause(); if (v) netReady(); };
    var onReady = function () {
      try { mraid.addEventListener('viewableChange', onViewable); } catch (e) {}
      var vis = true;
      try { vis = mraid.isViewable(); } catch (e) {}
      adViewable = vis; syncPause();
      if (vis) netReady();
    };
    try {
      if (mraid.getState() === 'loading') mraid.addEventListener('ready', onReady);
      else onReady();
    } catch (e) { netReady(); }
  } else netReady();
  document.addEventListener('visibilitychange', syncPause);
  window.addEventListener('resize', measure);
  measure();
  requestAnimationFrame(frame);
})();

</script>
<script>

  function pickaxe(c, gx, gy, ang, len, head) {

  // ---------------------------------------------------------------- state & layout

  function dig(x, y) {

  // ---------------------------------------------------------------- update
  function update(dt) {
    S.t += dt; S.idle += dt; S.tip += dt;
    S.findT=Math.max(0,S.findT-dt);
    if(S.held && S.dive<=0 && !PA.ended){S.holdT+=dt;if(S.holdT>=0.4){while(S.holdT>=0.25){S.holdT-=0.25;dig(S.holdX,S.holdY);}}}
    S.haulT+=dt;
    if(S.haulT>=1.2){S.haulT=0;var load=Math.min(S.ore,S.lift?28:8);S.ore-=load;addGold(load);}

    S.shake = Math.max(0, S.shake - dt);
    S.flash = Math.max(0, S.flash - dt);
    S.pop = Math.min(1, S.pop + dt * 3);
    S.bump = Math.max(0, S.bump - dt * 4);

    c.fillStyle = 'rgba(38,25,16,0.95)'; PA.rr(c, 14, y, 512, 78, 14); c.fill();
    c.strokeStyle = css(P.GOLD); c.lineWidth = 3; PA.rr(c, 14, y, 512, 78, 14); c.stroke();
    PA.text(title, 32, y + 25, { size: 25, font: PA.DISPLAY, color: css(P.GOLD), align: 'left', stroke: css(P.INK), strokeW: 4 });
    PA.text(body, 32, y + 56, { size: 18, font: PA.TEXT, color: css(P.CREAM), align: 'left', maxW: 480 });
    c.restore();
  }

  function drawBanner(c) {
    if (S.banner < 0.5 || PA.ended) return;
    var k = PA.ease.outBack(Math.min(1, (S.banner - 0.5) / 0.45)), y = L.ch.y + 70;
    c.save(); c.translate(270, y); c.scale(k, k); c.rotate(-0.03);
    c.fillStyle = 'rgba(30,18,10,0.9)'; PA.rr(c, -230, -66, 460, 132, 22); c.fill();
    c.strokeStyle = css(P.GOLD); c.lineWidth = 5; PA.rr(c, -230, -66, 460, 132, 22); c.stroke();
    PA.text('CLAY · 40 m', 0, -20, { size: 50, font: PA.DISPLAY, grad: ['#fff1a8', '#f0b93a'], stroke: css(P.INK), strokeW: 11 });
    PA.text('ORE WORTH x3!', 0, 34, { size: 32, font: PA.DISPLAY, color: css(P.GOOD), stroke: css(P.INK), strokeW: 8 });
    c.restore();
  }

  function draw(c, v) {
    if (!L || L.v !== v) layout(v);
    c.fillStyle = css(P.BG_DARK); c.fillRect(v.x, v.y, v.w, v.h);
    c.save();
    c.beginPath(); c.rect(v.x, L.top, v.w, L.h); c.clip();
    c.translate(0, L.top);
    drawStrata(c, v.x, v.x + v.w);
    drawChamber(c);
    drawShaft(c);
    drawParts(c);
    drawTip(c);
    drawBanner(c);
    if (S.flash > 0) { c.fillStyle = 'rgba(255,230,153,' + S.flash * 0.35 + ')'; c.fillRect(v.x, 0, v.w, L.h); }
    c.restore();
    drawHud(c, v);
    drawBottom(c, v);
    if(S.findT>0){
      c.fillStyle='rgba(29,19,12,0.94)';PA.rr(c,90,L.top+120,360,145,16);c.fill();
      var cx=270,cy=L.top+169;c.strokeStyle='#f7d477';c.fillStyle='#bd8547';c.lineWidth=6;
      if(S.finds.length===1){c.fillRect(cx-22,cy-23,25,45);c.fillRect(cx-22,cy+15,60,20);}
      else if(S.finds.length===2){c.fillStyle='#bdc8cc';c.fillRect(cx-22,cy-20,44,44);c.beginPath();c.arc(cx+27,cy,15,-Math.PI/2,Math.PI/2);c.stroke();}
      else{c.beginPath();for(var q=0;q<80;q++){var t=q/79*6*Math.PI,r=3+q*0.37;var x=cx+Math.cos(t)*r,y=cy+Math.sin(t)*r;if(!q)c.moveTo(x,y);else c.lineTo(x,y);}c.stroke();}
      PA.text(S.finds[S.finds.length-1],270,L.top+224,{size:26,font:PA.DISPLAY,color:'#fad15c',maxW:330});
      PA.text('COLLECTION '+S.finds.length+'/3',270,L.top+250,{size:17,color:'#faf2db'});
    }
  }

  // ---------------------------------------------------------------- input
  function down(x, y) {
    if (!L) return;
    var b = btnRect();
    if (Math.abs(x - b.x) < b.w / 2 + 6 && Math.abs(y - b.y) < b.h / 2 + 6) {
      if (!buy()) { S.btnPress = 0.6; PA.sfx('click', 0.4); }
      return;
    }
    if (y > L.top && y < L.bot && S.dive <= 0) {S.held=true;S.holdT=0;S.holdX=x;S.holdY=y-L.top;dig(x,y-L.top);}
  }

  PA.register({
    init: function () { reset(); layout(PA.view); },
    resize: function (v) { layout(v); },
    update: update,
    draw: draw,
    down: down,
    up: function(){S.held=false;},
    cancel: function(){S.held=false;},
    move: function(x,y){if(!L||y<L.top||y>L.bot)S.held=false;},
    inspect: function(){return {stage:S.stage,offer:offer(),gold:S.gold,ore:S.ore,lift:S.lift,finds:S.finds.slice(),miners:S.miners.length,held:S.held,btn:btnRect(),dig:[L.bx,L.top+L.by]};},
    debug: function (stage) {
      if (stage === 'hire') { S.gold = 22; S.taps = 6; S.stage = 'hire'; }
      if (stage === 'miners') { S.gold = 30; S.taps = 8; S.stage = 'deeper'; S.miners = [{ t0: -1, phase: 0 }, { t0: -1, phase: 0.5 }]; }
    },
  });
})();

</script>
</body>
</html>
