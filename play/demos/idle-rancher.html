<script>
/* Playable-ad runtime shared by every game.
 *

 * whichever axis the screen has extra room. Games draw in design units.
 *
 * A game registers itself with PA.register({ init, update, draw, down, move,
 * up, drawEndBg, debug }) and calls PA.win() when the payoff moment is done.
 * The runtime owns: canvas sizing, input, fonts/images/sounds, the persistent

(function () {
  'use strict';

  // ---------------------------------------------------------------- utils

    inOutSine: function (t) { t = PA.clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { t = PA.clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

  };
  PA.rr = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  PA.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['', 'K', 'M', 'B', 'T'], i = 0, v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.0+$/, '') + u[i];
  };
  // Draw an image to cover a rect (like CSS background-size: cover).
  // ax/ay pick which part survives the crop (0.5 = centre).
  PA.cover = function (c, im, x, y, w, h, ax, ay) {
    if (!im || !im.width) return;
    ax = ax == null ? 0.5 : ax; ay = ay == null ? 0.5 : ay;
    var s = Math.max(w / im.width, h / im.height);
    var dw = im.width * s, dh = im.height * s;
    c.drawImage(im, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
  };

  // Text with a chunky outline, the way the games style labels.
  PA.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var size = o.size || 32;
    var font = o.font || PA.HEAVY;
    c.save();
    c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font;
    if (o.maxW) {
      var w = c.measureText(str).width;
      if (w > o.maxW) { size = Math.floor(size * o.maxW / w); c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font; }
    }
    c.textAlign = o.align || 'center';
    c.textBaseline = o.base || 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    if (o.shadow) {
      c.fillStyle = o.shadow;
      if (o.stroke) { c.strokeStyle = o.shadow; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y + (o.shadowY || size * 0.09)); }
      c.fillText(str, x, y + (o.shadowY || size * 0.09));
    }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y); }
    if (o.grad) {
      var g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, o.grad[0]); g.addColorStop(1, o.grad[1]);
      c.fillStyle = g;
    } else c.fillStyle = o.color || '#fff';
    c.fillText(str, x, y);
    c.restore();
    return size;
  };

  // Chunky mobile-game button with a darker bottom lip.
  PA.button = function (x, y, w, h, label, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var press = o.press || 0;
    var lip = o.lip == null ? Math.round(h * 0.1) : o.lip;
    var r = o.r == null ? h * 0.28 : o.r;
    c.save();
    c.translate(x, y);
    if (o.scale) c.scale(o.scale, o.scale);
    var top = -h / 2 + press * lip;
    if (o.glow) {
      c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30;
    }
    c.fillStyle = o.lipColor || 'rgba(0,0,0,0.35)';
    PA.rr(c, -w / 2, -h / 2 + lip, w, h, r); c.fill();
    c.shadowBlur = 0;
    if (o.edge) {
      c.fillStyle = o.edge;
      PA.rr(c, -w / 2, top, w, h, r); c.fill();
    }
    var bw = o.edge ? (o.edgeW || 4) : 0;
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, o.top || o.fill || '#e07a35');
    g.addColorStop(1, o.fill || '#c85f22');
    c.fillStyle = g;
    PA.rr(c, -w / 2 + bw, top + bw, w - bw * 2, h - bw * 2, r - bw); c.fill();

    c.globalAlpha = 0.22;
    c.fillStyle = '#fff';
    PA.rr(c, -w / 2 + bw + 8, top + bw + 5, w - bw * 2 - 16, (h - bw * 2) * 0.36, (r - bw) * 0.8); c.fill();
    c.globalAlpha = 1;
    PA.text(label, 0, top + h / 2 + (o.textDy || 1), {
      ctx: c, size: o.size || h * 0.42, font: o.font || PA.HEAVY, color: o.color || '#fff',
      stroke: o.textStroke, strokeW: o.textStrokeW, shadow: o.textShadow === false ? null : (o.textShadow || 'rgba(0,0,0,0.25)'),
      shadowY: 2, maxW: w - 36,
    });
    c.restore();
  };

  // ---------------------------------------------------------------- fx
  var pops = [], parts = [], flyers = [];
  // Floating label: rises, pops in, fades.
  PA.pop = function (str, x, y, o) {
    o = o || {};
    pops.push({ s: str, x: x, y: y, t: 0, life: o.life || 0.9, size: o.size || 36, color: o.color || '#fff',
      stroke: o.stroke || 'rgba(0,0,0,0.85)', font: o.font || PA.HEAVY, rise: o.rise == null ? 70 : o.rise, grad: o.grad });
  };
  // Particle burst. o.shape: 'circle' | 'rect' | 'star' | function(c, p)
  PA.burst = function (x, y, n, o) {
    o = o || {};
    var cols = o.colors || ['#fff'];
    for (var i = 0; i < n; i++) {
      var a = o.angle != null ? o.angle + PA.rand(-o.spread, o.spread) : PA.rand(0, Math.PI * 2);
      var sp = PA.rand(o.speedMin || 120, o.speed || 420);
      parts.push({ x: x + PA.rand(-(o.jitter || 0), o.jitter || 0), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.gravity == null ? 900 : o.gravity, drag: o.drag || 0, t: 0, life: PA.rand((o.life || 0.9) * 0.7, o.life || 0.9),
        size: PA.rand(o.sizeMin || 4, o.size || 10), grow: o.grow || 0, color: cols[(Math.random() * cols.length) | 0],
        rot: PA.rand(0, 6.28), vr: PA.rand(-10, 10), shape: o.shape || 'circle', fade: o.fade !== false });
    }
  };
  // Something flies from A to B on an arc, then onArrive fires.
  PA.fly = function (x0, y0, x1, y1, o) {
    o = o || {};
    flyers.push({ x0: x0, y0: y0, x1: x1, y1: y1, t: -(o.delay || 0), dur: o.dur || 0.6, draw: o.draw,
      arc: o.arc == null ? -120 : o.arc, cb: o.onArrive, size: o.size || 1 });
  };
  function star(c, r) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  }
  PA.star = star;
  function updFx(dt) {
    var i;
    for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > pops[i].life) pops.splice(i, 1); }
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t > p.life) { parts.splice(i, 1); continue; }
      if (p.drag) { var d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.size += p.grow * dt;
    }
    for (i = flyers.length - 1; i >= 0; i--) {
      var f = flyers[i];
      f.t += dt;
      if (f.t >= f.dur) { flyers.splice(i, 1); if (f.cb) f.cb(); }
    }
  }
  function drawFx(c) {
    var i;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i], k = p.t / p.life;
      c.save();
      c.globalAlpha = p.fade ? 1 - k * k : 1;
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      if (typeof p.shape === 'function') p.shape(c, p);
      else if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === 'star') { star(c, p.size); c.fill(); }
      else { c.beginPath(); c.arc(0, 0, p.size, 0, 6.283); c.fill(); }
      c.restore();
    }
    for (i = 0; i < flyers.length; i++) {
      var f = flyers[i];
      if (f.t < 0) continue;
      var u = PA.ease.inOutSine(f.t / f.dur);
      var x = PA.lerp(f.x0, f.x1, u), y = PA.lerp(f.y0, f.y1, u) + f.arc * Math.sin(Math.PI * u);
      if (f.draw) f.draw(c, x, y, u);

    for (i = 0; i < pops.length; i++) {
      var q = pops[i], k2 = q.t / q.life;
      var sc = k2 < 0.15 ? PA.ease.outBack(k2 / 0.15) : 1;
      c.save();
      c.translate(q.x, q.y - q.rise * PA.ease.outCubic(k2));
      c.scale(sc, sc);
      PA.text(q.s, 0, 0, { ctx: c, size: q.size, font: q.font, color: q.color, grad: q.grad, stroke: q.stroke,
        alpha: k2 > 0.7 ? 1 - (k2 - 0.7) / 0.3 : 1 });
      c.restore();
    }
  }

  // Subtle touch cue: no cursor glove obscuring the game. The existing
  // hand coordinates animate the touch point along the demonstrated drag.
  PA.drawHand = function (x, y, o) {
    o = o || {};
    var c = ctx, pulse = (PA.t * 1.4) % 1, r = (o.press ? 13 : 17) * (o.scale || 1);
    c.save();

  // ---------------------------------------------------------------- audio
  var actx = null, sounds = {}, muted = true;
  function b64ToBuf(b64) {

  }
  PA.sfx = function (name, vol, rate) {

  };
  var toast = null;
  window.__ctaLog = [];
  PA.cta = function () {
    PA.sfx('click', 0.6);
    var url = PA.storeUrl();
    window.__ctaLog.push({ net: NET, url: url, t: +PA.t.toFixed(2) });
    try {
      if (NET === 'mraid') {
        if (window.mraid && typeof mraid.open === 'function') mraid.open(url);
        else window.open(url, '_blank');
      } else if (NET === 'google') {

  };

  // ---------------------------------------------------------------- layout
  var cssW = 0, cssH = 0;

  // ---------------------------------------------------------------- install pill

      color: THEME.ctaText || '#fff', r: 23, lip: 4, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: 1 + 0.04 * Math.sin(PA.t * 4),

  }

  // ---------------------------------------------------------------- end card

  // Called by the game when the payoff is done; the end card follows `delay` s later.
  PA.win = function (delay) {
    if (triggered) return;

  };
  PA.showEnd = function () { PA.win(0); };
  function endButton() { return { x: 270, y: 480 + 236, w: 380, h: 104 }; }
  function drawEnd(dt) {
    endT += dt;
    if (endT < 0) return;
    if (!PA.ended) {
      Object.keys(activePointers).forEach(function(key){onCancel({pointerId:activePointers[key]});});

    }

    g.addColorStop(0.5, THEME.endMid || 'rgba(20,10,4,0.72)');

    wrapText(CFG.pitch, 270, ny + (THEME.pitchDy || 74), 470, 28, { size: 25, font: PA.TEXT, color: THEME.pitch || '#fbefd6', stroke: 'rgba(0,0,0,0.55)', strokeW: 6 });

      PA.button(b.x, b.y, b.w, b.h, THEME.ctaLabel || 'PLAY FREE', {
        fill: THEME.cta || '#d9732f', top: THEME.ctaTop || THEME.cta, edge: THEME.ctaEdge, edgeW: 5,
        color: THEME.ctaText || '#fff', size: 46, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: bk * (1 + 0.05 * Math.sin(PA.t * 5.5)),

    }
  }
  function imagesLoaded() { ready.imgs = true; tryStart(); }
  var keys = Object.keys(AS.img || {}), left = keys.length;
  if (!left) ready.imgs = true;
  keys.forEach(function (k) {

  });

  // Fonts are inline data URIs; ask the browser to load them, cap the wait.

      document.fonts.load('40px "PA Display"'), document.fonts.load('40px "PA Text"'), document.fonts.load('40px "PA Heavy"'),

  } else fontsDone();

  // Network readiness: MRAID waits for `ready` and a viewable container.
  function netReady() { if (!ready.net) { ready.net = true; tryStart(); } }
  if (NET === 'mraid' && window.mraid) {
    var onViewable = function (v) { adViewable = !!v; syncPause(); if (v) netReady(); };

      try { mraid.addEventListener('viewableChange', onViewable); } catch (e) {}

    } catch (e) { netReady(); }
  } else netReady();

  window.addEventListener('resize', measure);
  measure();
  requestAnimationFrame(frame);
})();

  var TREE = C(0.33, 0.58, 0.24), TREE_LIGHT = C(0.45, 0.70, 0.30), TREE_DARK = C(0.24, 0.45, 0.18), TRUNK = C(0.45, 0.30, 0.18);
  var FENCE = C(0.99, 0.97, 0.92), FENCE_SHADE = C(0.80, 0.76, 0.68), TRUCK_RED = C(0.90, 0.36, 0.24);

  // ---------------------------------------------------------------- scene layout (design space)
  var HEN_PLOT = { x: 24, y: 262, w: 492, h: 214 };

  // ---------------------------------------------------------------- simulation
  function setPhase(p) { S.phase = p; S.tipT = 0; }
  function stepAnimal(a, dt, room, speed) {
    a.blink -= dt;
    if (a.blink < -0.14) a.blink = PA.rand(2, 5);
    var dx = a.tx - a.x, dy = a.ty - a.y, d = Math.sqrt(dx * dx + dy * dy);
    if (d < 2) {
      a.walk = false; a.idle -= dt;
      a.peck = PA.clamp(Math.sin(PA.t * 3 + a.ph) * 1.6 - 0.6, 0, 1);
      if (a.idle <= 0) {
        a.tx = PA.clamp(a.x + PA.rand(-90, 90), room.x0, room.x1);
        a.ty = PA.clamp(a.y + PA.rand(-40, 40), room.y0, room.y1);
        a.idle = PA.rand(1.5, 4);
      }
    } else {
      a.walk = true; a.peck = 0;
      var st = Math.min(d, speed * dt);
      a.x += dx / d * st; a.y += dy / d * st;
      a.f = dx > 0 ? 1 : -1;
      a.ph += dt;
    }
  }
  function spawn(list, dt, every, key) {
    S[key] += dt;
    if (S[key] < every) return;
    S[key] = 0;
    var free = list.filter(function (b) { return !b.on && b.out < 0; });
    if (!free.length) return;
    var b = free[(Math.random() * free.length) | 0];
    b.on = true; b.t = 0;
  }
  function update(dt) {
    S.t += dt;
    S.tipT += dt;
    S.bump = Math.max(0, S.bump - dt * 4);
    S.shown += (S.coins - S.shown) * Math.min(1, dt * 10);
    if (Math.abs(S.coins - S.shown) < 0.5) S.shown = S.coins;
    // passive income (hens + cow)
    if (S.phase !== 'done') {
      S.passive += dt * S.rate;
      if (S.passive >= 1) { var p = Math.floor(S.passive); S.passive -= p; S.coins += p; }
    }
    var henRoom = { x0: HEN_PLOT.x + 50, x1: HEN_PLOT.x + HEN_PLOT.w - 150, y0: HEN_PLOT.y + 110, y1: HEN_PLOT.y + HEN_PLOT.h - 22 };
    S.hens.forEach(function (h) { stepAnimal(h, dt, henRoom, 30); });
    if (S.cow) {
      var c = S.cow;
      if (c.enter) {
        c.walk = true; c.ph += dt; c.f = 1;
        c.y = Math.max(c.ty, c.y - dt * 120);
        c.x += (c.tx - c.x) * Math.min(1, dt * 1.5);
        c.blink -= dt; if (c.blink < -0.14) c.blink = PA.rand(2, 5);
        if (c.y <= c.ty + 0.5) {
          c.enter = false; c.walk = false; c.idle = 0.6;
          S.milk[1].on = true; S.milk[1].t = 0; S.milk[2].on = true; S.milk[2].t = -0.15;
          PA.sfx('collect', 0.5, 0.8);
        }
      } else stepAnimal(c, dt, { x0: COW_PLOT.x + 90, x1: COW_PLOT.x + COW_PLOT.w - 170, y0: COW_PLOT.y + 140, y1: COW_PLOT.y + COW_PLOT.h - 24 }, 20);
    }
    if (S.cowOpen > 0 && S.cowOpen < 1) S.cowOpen = Math.min(1, S.cowOpen + dt * 2.2);
    [S.eggs, S.milk].forEach(function (list) {
      list.forEach(function (b) {
        if (b.on) b.t += dt;
        if (b.out >= 0) { b.out += dt * 4; if (b.out >= 1) b.out = -1; }
      });
    });
    if (S.phase !== 'done' && S.phase !== 'truck') spawn(S.eggs, dt, 0.8, 'eggT');
    if (S.cow && !S.cow.enter && S.phase === 'cow') spawn(S.milk, dt, 0.55, 'milkT');
    if (S.phase === 'eggs' && S.coins >= COW_COST) setPhase('buy');
    if (S.phase === 'cow' && S.milkGot >= 3) { S.wait = (S.wait || 0) + dt; if (S.wait > 0.9) startTruck(); }
    // Hands reserve a real bubble, walk out, pick it up, and deliver it.
    while(S.workers.length<S.hands)S.workers.push({x:290,y:820,target:null,carry:null});
    S.workers.forEach(function(w){
      if(!w.target&&!w.carry&&S.phase==='cow'){
        var milk=S.milk.find(function(b){return b.on&&!S.workers.some(function(other){return other.target===b;});});
        var egg=S.eggs.find(function(b){return b.on&&!S.workers.some(function(other){return other.target===b;});});
        w.target=milk||egg||null;w.kind=milk?'milk':'egg';
      }
      if(!w.target&&!w.carry)return;
      var tx=w.carry?290:w.target.x,ty=w.carry?820:w.target.y,dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy),step=Math.min(d,dt*230);
      if(d>1){w.x+=dx/d*step;w.y+=dy/d*step;return;}
      if(w.carry){collect({x:w.x,y:w.y,on:false,out:0},w.carry.kind);w.carry=null;w.target=null;}
      else if(w.target.on){w.target.on=false;w.target.out=0;w.carry={kind:w.kind};w.target=null;}
      else w.target=null;
    });
    // truck
    if (S.truckT >= 0) {
      S.truckT += dt;
      S.truckX = TRUCK_HOME.x + Math.pow(Math.max(0, S.truckT - 0.4), 2) * 260;
      if (S.truckT > 0.4 && S.truckT - dt <= 0.4) PA.sfx('truck', 0.7);
      if (S.payT < 0 && S.truckX > PA.view.x + PA.view.w + 90) payout();
    }
    tutorial();
  }

  function tutorial() {
    var hand = null;
    var bob = Math.abs(Math.sin(PA.t * 3.2));
    if (S.phase === 'eggs' && S.collected < 2) {
      var b = S.eggs.filter(function (q) { return q.on && q.t > 0.3; })[0];
      if (b) hand = { x: b.x + 4, y: b.y + 10 + bob * 14, press: bob < 0.25, scale: 1 };
    } else if (S.phase === 'buy') {
      var r = signRect();
      hand = { x: SIGN.x + 40, y: r.y + r.h - 4 + bob * 16, press: bob < 0.25, scale: 1.05 };
    } else if (S.phase === 'cow' && S.milkGot < 1) {
      var m = S.milk.filter(function (q) { return q.on && q.t > 0.3; })[0];
      if (m) hand = { x: m.x + 4, y: m.y + 10 + bob * 14, press: bob < 0.25, scale: 1 };
    }
    PA.hand = hand;
  }

  function flyCoins(x, y, n, value, dur) {
    var v = PA.view, to = hudCoin(v), each = value / n, acc = 0;

        PA.fly(x + PA.rand(-18, 18), y + PA.rand(-12, 12), to.x, to.y, {

          onArrive: function () { S.coins += amt; S.bump = 1; if (i % 2 === 0) PA.sfx('collect', 0.25, 1.4); },
        });
      })(amt, i);
    }
  }
  function collect(b, kind) {

  function startTruck() {

  function payout() {

    PA.sfx('sell',0.8);PA.pop('MARKET +'+amount,270,PA.view.y+250,{font:PA.DISPLAY,size:32,color:GOLD_BRIGHT,stroke:CTA_DARK,life:1.8,rise:40});

  function chooseUpgrade(kind){

    PA.text('Hands walk, collect and carry goods.',270,580,{size:18,color:CREAM,maxW:450});
    PA.button(270,632,430,70,'CHEESE PRESS  '+(100+S.cheese*80),{fill:'#ad7938',top:'#c99d53',edge:GOLD_BRIGHT,size:25});

  // ---------------------------------------------------------------- input
  function hit(b, x, y) { var dx = x - b.x, dy = y - b.y; return dx * dx + dy * dy < 46 * 46; }
  function down(x, y) {
    if(S.phase==='upgrade'){if(y>493&&y<566)chooseUpgrade('hands');else if(y>596&&y<669)chooseUpgrade('cheese');return;}
    if (S.phase === 'done' || S.phase === 'truck') return;
    var i;
    for (i = 0; i < S.milk.length; i++) if (S.milk[i].on && hit(S.milk[i], x, y)) { collect(S.milk[i], 'milk'); return; }
    for (i = 0; i < S.eggs.length; i++) if (S.eggs[i].on && hit(S.eggs[i], x, y)) { collect(S.eggs[i], 'egg'); return; }
    if (S.phase === 'buy') {
      var r = signRect();
      if (x > r.x - 30 && x < r.x + r.w + 30 && y > r.y - 30 && y < SIGN.y + 10) { buyCow(); return; }
    }
    // generous: a tap near any bubble row collects the nearest one
    var best = null, bd = 1e9, kind = 'egg';
    [[S.eggs, 'egg'], [S.milk, 'milk']].forEach(function (pair) {
      pair[0].forEach(function (b) {
        if (!b.on) return;
        var d = (b.x - x) * (b.x - x) + (b.y - y) * (b.y - y);
        if (d < bd) { bd = d; best = b; kind = pair[1]; }
      });
    });
    if (best && bd < 90 * 90) collect(best, kind);
  }

    down: down,
    drawEndTitle: function (c, x, y) {
      PA.text('IDLE RANCHER', x, y, { size: 70, font: PA.DISPLAY, color: GOLD_BRIGHT, stroke: CTA_DARK, strokeW: 14, shadow: 'rgba(0,0,0,0.45)', shadowY: 6, maxW: 500 });
    },
    debug: function (stage) {
      if (stage === 'buy') { S.coins = S.shown = 60; S.collected = 3; }
      if (stage === 'cow') { S.coins = S.shown = 60; buyCow(); }
    },
  });
})();

</script>
