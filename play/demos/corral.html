<script>
/* Playable-ad runtime shared by every game.

 * whichever axis the screen has extra room. Games draw in design units.
 *

 * up, drawEndBg, debug }) and calls PA.win() when the payoff moment is done.
 * The runtime owns: canvas sizing, input, fonts/images/sounds, the persistent

(function () {

  // ---------------------------------------------------------------- utils

    inOutSine: function (t) { t = PA.clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { t = PA.clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

  };

    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  PA.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['', 'K', 'M', 'B', 'T'], i = 0, v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.0+$/, '') + u[i];
  };
  // Draw an image to cover a rect (like CSS background-size: cover).
  // ax/ay pick which part survives the crop (0.5 = centre).
  PA.cover = function (c, im, x, y, w, h, ax, ay) {
    if (!im || !im.width) return;
    ax = ax == null ? 0.5 : ax; ay = ay == null ? 0.5 : ay;
    var s = Math.max(w / im.width, h / im.height);
    var dw = im.width * s, dh = im.height * s;
    c.drawImage(im, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
  };

  // Text with a chunky outline, the way the games style labels.
  PA.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var size = o.size || 32;
    var font = o.font || PA.HEAVY;
    c.save();
    c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font;
    if (o.maxW) {
      var w = c.measureText(str).width;
      if (w > o.maxW) { size = Math.floor(size * o.maxW / w); c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font; }
    }
    c.textAlign = o.align || 'center';
    c.textBaseline = o.base || 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    if (o.shadow) {
      c.fillStyle = o.shadow;
      if (o.stroke) { c.strokeStyle = o.shadow; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y + (o.shadowY || size * 0.09)); }
      c.fillText(str, x, y + (o.shadowY || size * 0.09));
    }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y); }
    if (o.grad) {
      var g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, o.grad[0]); g.addColorStop(1, o.grad[1]);
      c.fillStyle = g;
    } else c.fillStyle = o.color || '#fff';
    c.fillText(str, x, y);
    c.restore();
    return size;
  };

  // Chunky mobile-game button with a darker bottom lip.
  PA.button = function (x, y, w, h, label, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var press = o.press || 0;
    var lip = o.lip == null ? Math.round(h * 0.1) : o.lip;
    var r = o.r == null ? h * 0.28 : o.r;
    c.save();
    c.translate(x, y);
    if (o.scale) c.scale(o.scale, o.scale);
    var top = -h / 2 + press * lip;
    if (o.glow) {
      c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30;
    }
    c.fillStyle = o.lipColor || 'rgba(0,0,0,0.35)';
    PA.rr(c, -w / 2, -h / 2 + lip, w, h, r); c.fill();
    c.shadowBlur = 0;
    if (o.edge) {
      c.fillStyle = o.edge;
      PA.rr(c, -w / 2, top, w, h, r); c.fill();
    }
    var bw = o.edge ? (o.edgeW || 4) : 0;
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, o.top || o.fill || '#e07a35');
    g.addColorStop(1, o.fill || '#c85f22');
    c.fillStyle = g;
    PA.rr(c, -w / 2 + bw, top + bw, w - bw * 2, h - bw * 2, r - bw); c.fill();

    c.globalAlpha = 0.22;
    c.fillStyle = '#fff';
    PA.rr(c, -w / 2 + bw + 8, top + bw + 5, w - bw * 2 - 16, (h - bw * 2) * 0.36, (r - bw) * 0.8); c.fill();
    c.globalAlpha = 1;
    PA.text(label, 0, top + h / 2 + (o.textDy || 1), {
      ctx: c, size: o.size || h * 0.42, font: o.font || PA.HEAVY, color: o.color || '#fff',
      stroke: o.textStroke, strokeW: o.textStrokeW, shadow: o.textShadow === false ? null : (o.textShadow || 'rgba(0,0,0,0.25)'),
      shadowY: 2, maxW: w - 36,
    });
    c.restore();
  };

  // ---------------------------------------------------------------- fx
  var pops = [], parts = [], flyers = [];
  // Floating label: rises, pops in, fades.
  PA.pop = function (str, x, y, o) {
    o = o || {};
    pops.push({ s: str, x: x, y: y, t: 0, life: o.life || 0.9, size: o.size || 36, color: o.color || '#fff',
      stroke: o.stroke || 'rgba(0,0,0,0.85)', font: o.font || PA.HEAVY, rise: o.rise == null ? 70 : o.rise, grad: o.grad });
  };
  // Particle burst. o.shape: 'circle' | 'rect' | 'star' | function(c, p)
  PA.burst = function (x, y, n, o) {
    o = o || {};
    var cols = o.colors || ['#fff'];
    for (var i = 0; i < n; i++) {
      var a = o.angle != null ? o.angle + PA.rand(-o.spread, o.spread) : PA.rand(0, Math.PI * 2);
      var sp = PA.rand(o.speedMin || 120, o.speed || 420);
      parts.push({ x: x + PA.rand(-(o.jitter || 0), o.jitter || 0), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.gravity == null ? 900 : o.gravity, drag: o.drag || 0, t: 0, life: PA.rand((o.life || 0.9) * 0.7, o.life || 0.9),
        size: PA.rand(o.sizeMin || 4, o.size || 10), grow: o.grow || 0, color: cols[(Math.random() * cols.length) | 0],
        rot: PA.rand(0, 6.28), vr: PA.rand(-10, 10), shape: o.shape || 'circle', fade: o.fade !== false });
    }
  };
  // Something flies from A to B on an arc, then onArrive fires.
  PA.fly = function (x0, y0, x1, y1, o) {
    o = o || {};
    flyers.push({ x0: x0, y0: y0, x1: x1, y1: y1, t: -(o.delay || 0), dur: o.dur || 0.6, draw: o.draw,
      arc: o.arc == null ? -120 : o.arc, cb: o.onArrive, size: o.size || 1 });
  };

    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    c.closePath();
  }
  PA.star = star;
  function updFx(dt) {
    var i;
    for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > pops[i].life) pops.splice(i, 1); }
    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.t += dt;
      if (p.t > p.life) { parts.splice(i, 1); continue; }
      if (p.drag) { var d = Math.max(0, 1 - p.drag * dt); p.vx *= d; p.vy *= d; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.size += p.grow * dt;
    }
    for (i = flyers.length - 1; i >= 0; i--) {
      var f = flyers[i];
      f.t += dt;
      if (f.t >= f.dur) { flyers.splice(i, 1); if (f.cb) f.cb(); }
    }
  }
  function drawFx(c) {
    var i;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i], k = p.t / p.life;
      c.save();
      c.globalAlpha = p.fade ? 1 - k * k : 1;
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      if (typeof p.shape === 'function') p.shape(c, p);
      else if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      else if (p.shape === 'star') { star(c, p.size); c.fill(); }
      else { c.beginPath(); c.arc(0, 0, p.size, 0, 6.283); c.fill(); }
      c.restore();
    }
    for (i = 0; i < flyers.length; i++) {
      var f = flyers[i];
      if (f.t < 0) continue;
      var u = PA.ease.inOutSine(f.t / f.dur);
      var x = PA.lerp(f.x0, f.x1, u), y = PA.lerp(f.y0, f.y1, u) + f.arc * Math.sin(Math.PI * u);
      if (f.draw) f.draw(c, x, y, u);

      var q = pops[i], k2 = q.t / q.life;
      var sc = k2 < 0.15 ? PA.ease.outBack(k2 / 0.15) : 1;
      c.save();
      c.translate(q.x, q.y - q.rise * PA.ease.outCubic(k2));
      c.scale(sc, sc);
      PA.text(q.s, 0, 0, { ctx: c, size: q.size, font: q.font, color: q.color, grad: q.grad, stroke: q.stroke,
        alpha: k2 > 0.7 ? 1 - (k2 - 0.7) / 0.3 : 1 });
      c.restore();
    }
  }

  // Subtle touch cue: no cursor glove obscuring the game. The existing
  // hand coordinates animate the touch point along the demonstrated drag.
  PA.drawHand = function (x, y, o) {
    o = o || {};

  // ---------------------------------------------------------------- audio

  function hud(c, v) {
    var top = v.y;
    var bp = barnPos(v), bs = 1 + 0.25 * S.barnBump;
    c.save(); c.translate(bp.x + 22, bp.y + 22); c.scale(bs, bs);
    barn(c, -22, -22, 44, 44);
    c.restore();
    PA.text('PENNED ' + S.penned, bp.x + 54, bp.y + 24, { size: 21, font: PA.HEAVY, color: C.cream, align: 'left', stroke: 'rgba(0,0,0,0.45)', strokeW: 5 });
    var sc = 1 + (S.shown < S.score ? 0.12 : 0);
    c.save(); c.translate(270, top + 50); c.scale(sc, sc);
    PA.text(PA.fmt(S.shown), 0, 0, { size: 62, font: PA.DISPLAY, color: C.cream, stroke: 'rgba(0,0,0,0.35)', strokeW: 8, shadow: 'rgba(0,0,0,0.3)', shadowY: 4 });
    c.restore();
    PA.text('LEVEL ' + S.round + '/3  |  ' + S.budget + ' PIECES LEFT', 270, top + 92, { size: 18, font: PA.HEAVY, color: C.muted });
    // instruction between HUD and board
    var msg = S.failed ? 'TRY A DIFFERENT FENCE' : S.closed ? 'GOAL COMPLETE!' : 'PEN ' + S.goal + ' ANIMALS · ' + S.goalMade + '/' + S.goal;
    var iy = Math.max(top + 122, GY - FRAME - 26);
    var pk = S.closed ? 1 + 0.06 * Math.sin(PA.t * 8) : 1;
    c.save(); c.translate(270, iy); c.scale(pk, pk);
    PA.text(msg, 0, 0, { size: S.closed ? 34 : 25, font: PA.DISPLAY, color: S.closed ? C.gold : C.cream, stroke: '#1d2e17', strokeW: 7, maxW: 500 });
    c.restore();
  }

  function drawBoard(c) {
    var side = CS * N;
    c.fillStyle = 'rgba(0,0,0,0.30)'; c.fillRect(GX - FRAME, GY - FRAME + 5, side + FRAME * 2, side + FRAME * 2);
    c.fillStyle = C.woodDark; c.fillRect(GX - FRAME, GY - FRAME, side + FRAME * 2, side + FRAME * 2);
    c.fillStyle = C.wood; c.fillRect(GX - FRAME + 3, GY - FRAME + 3, side + FRAME * 2 - 6, side + FRAME * 2 - 6);
    c.fillStyle = C.woodDark; c.fillRect(GX - 2, GY - 2, side + 4, side + 4);
    var x, y, fset = {};
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
      var r = cellRect(x, y);
      grass(c, r.x, r.y, CS, (x + y) % 2 === 0);
      if (get(x, y) === 1) fset[x + ',' + y] = true;
    }
    // pen flash
    S.flashes.forEach(function (f) {
      if (f.t < 0) return;
      c.fillStyle = 'rgba(255,224,102,' + (0.75 * (1 - f.t / 1.1)) + ')';
      f.cells.forEach(function (cc) { var r = cellRect(cc[0], cc[1]); c.fillRect(r.x, r.y, CS, CS); });
    });
    // Only the opening puzzle is guided. Later choices are real placements.
    if (!S.closed && S.round === 1) {
      var pulse = 0.5 + 0.5 * Math.sin(PA.t * 5);
      PIECES.forEach(function (p, i) {
        if (S.placed[i]) return;
        var near = S.drag && S.drag.i === i && S.drag.snap;
        p.cells.forEach(function (o) {
          var r = cellRect(p.target[0] + o[0], p.target[1] + o[1]);
          c.fillStyle = near ? 'rgba(255,255,220,0.55)' : 'rgba(255,224,102,' + (0.16 + 0.16 * pulse) + ')';
          c.fillRect(r.x + 2, r.y + 2, CS - 4, CS - 4);
          c.setLineDash([8, 6]); c.lineWidth = 3;
          c.strokeStyle = 'rgba(255,240,170,' + (0.45 + 0.4 * pulse) + ')';
          c.strokeRect(r.x + 5, r.y + 5, CS - 10, CS - 10);
          c.setLineDash([]);
        });
      });
      // the dragged piece about to close the pen: glow the pen like the game
      if (S.drag && S.drag.snap && S.placed.filter(Boolean).length === PIECES.length - 1) {
        c.fillStyle = 'rgba(255,224,102,' + (0.30 + 0.15 * Math.sin(PA.t * 8)) + ')';
        PEN.forEach(function (cc) { var r = cellRect(cc[0], cc[1]); c.fillRect(r.x, r.y, CS, CS); });
      }
      if (S.drag && S.drag.snap) {
        var dp = PIECES[S.drag.i], go = S.drag.origin || dp.target, o = cellRect(go[0], go[1]);
        piece(c, o.x, o.y, CS, dp.cells, 0.45);
      }
    }
    for (var key in fset) {
      var xy = key.split(',').map(Number), rr = cellRect(xy[0], xy[1]), sc = 1;
      if (S.pops[key] != null) sc = 1 + 0.22 * Math.sin(S.pops[key] / 0.22 * Math.PI);
      fence(c, rr.x, rr.y, CS, maskOf(fset, xy[0], xy[1]), sc, 1);
    }
    S.fenceOut.forEach(function (f) {
      if (f.t < 0) return;
      var t = f.t / 0.35, r = cellRect(f.x, f.y);
      fence(c, r.x, r.y, CS, f.mask, 1 + 0.3 * t, 1 - t);
    });
    for (y = 0; y < N; y++) for (x = 0; x < N; x++) {
      if (get(x, y) !== 2) continue;
      var ar = cellRect(x, y), bob = Math.sin(PA.t * 2.4 + x * 7 + y * 13) * CS * 0.025;
      var blink = ((PA.t + x * 1.3 + y * 0.7) % 3.7) < 0.12;
      var sp = S.spawns[x + ',' + y], asz = CS * 0.92;
      if (sp != null && sp < 0.35) asz *= PA.ease.outBack(sp / 0.35);
      drawAnimal(c, ar.x + CS / 2, ar.y + CS / 2 + bob, asz, S.kinds[y * N + x], blink);
    }
    S.hops.forEach(function (h) {
      if (h.t < 0) { var r0 = cellRect(h.x, h.y); drawAnimal(c, r0.x + CS / 2, r0.y + CS / 2, CS * 0.92, h.k, false); return; }
      var r = cellRect(h.x, h.y), u = h.t / 0.45, jump = Math.sin(u * Math.PI) * CS * 0.45;
      drawAnimal(c, r.x + CS / 2, r.y + CS / 2 - jump - u * 18, CS * 0.92 * (1 + 0.15 * Math.sin(u * Math.PI)), h.k, false);
    });
  }

  function drawTray(c) {
    for (var i = 0; i < PIECES.length; i++) {
      var r = slotRect(i);
      c.fillStyle = 'rgba(12,20,10,0.55)';
      PA.rr(c, r.x, r.y, r.w, r.h, 12); c.fill();
      c.strokeStyle = 'rgba(158,181,145,0.18)'; c.lineWidth = 2;
      PA.rr(c, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 12); c.stroke();
      if (S.placed[i] || (S.drag && S.drag.i === i) || (S.demo && S.demo.i === i)) continue;
      var p = PIECES[i], sz = pieceSize(p, TRAY.cell), ret = null;
      for (var j = 0; j < S.ret.length; j++) if (S.ret[j].i === i) ret = S.ret[j];
      var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
      if (ret) { var u = PA.ease.outCubic(ret.t / 0.25); cx = PA.lerp(ret.x, cx, u); cy = PA.lerp(ret.y, cy, u); }
      var bounce = !S.firstDone && i === 0 ? 1 + 0.06 * Math.sin(PA.t * 6) : 1;
      c.save(); c.translate(cx, cy); c.scale(bounce, bounce);
      piece(c, -sz.w / 2, -sz.h / 2, TRAY.cell, p.cells, 1);
      c.restore();
    }
  }

  // ---------------------------------------------------------------- input
  function dropOrigin(i,x,y){var z=pieceSize(PIECES[i],CS);return [Math.round((x-z.w/2-GX)/CS),Math.round((y-LIFT-z.h/2-GY)/CS)];}
  function snapFor(i,x,y){return legal(i,dropOrigin(i,x,y));}
  function down(x, y, id) {
    if (S.closed || S.failed) {
      if(y>740&&y<835&&(!S.closed||S.round<3))reset(S.round+(S.closed?1:0),S.score,S.penned);
      return;
    }
    if (S.drag) return;
    S.idle = 0;
    for (var i = 0; i < PIECES.length; i++) {
      if (S.placed[i]) continue;
      var r = slotRect(i);
      if (x >= r.x - 6 && x <= r.x + r.w + 6 && y >= r.y - 30 && y <= r.y + r.h + 20) {
        S.drag = { i: i, x: x, y: y, k: 0, id: id, snap: false };
        PA.hand = null; S.demo = null;
        PA.sfx('pick', 0.6);
        return;
      }
    }
  }
  function move(x, y, id) {
    if (!S.drag || S.drag.id !== id) return;
    S.idle = 0;
    S.drag.x = x; S.drag.y = y;
    S.drag.snap = snapFor(S.drag.i, x, y);
    S.drag.origin = dropOrigin(S.drag.i,x,y);
  }
  function up(x, y, id) {
    if (!S.drag || S.drag.id !== id) return;
    var d = S.drag;
    S.drag = null; S.idle = 0;
    if (snapFor(d.i, x, y)) place(d.i,dropOrigin(d.i,x,y));
    else {
      if (y < TRAY.y - 20) PA.sfx('invalid', 0.5);
      S.ret.push({ i: d.i, x: x, y: y - LIFT * d.k, t: 0 });
    }
  }

  PA.register({
    init: function(){reset(1);},
    inspect: function(){return {round:S.round,budget:S.budget,goal:S.goal,goalMade:S.goalMade,closed:S.closed,failed:S.failed,placed:S.placed.slice(),pieces:PIECES.map(function(p){return {cells:p.cells.map(function(c){return c.slice();}),target:p.target.slice()};}),wolf:S.wolf?S.wolf.slice():null,cells:S.cells.slice(),score:S.score};},
    update: update,
    draw: draw,
    down: down, move: move, up: up,
    cancel: function (id) { if (S.drag && S.drag.id === id) S.drag = null; },
    drawEndBg: function (c, v) { backdrop(v); },
    drawEndTitle: function (c, x, y) {
      PA.text('CORRAL', x, y, { size: 92, font: PA.DISPLAY, color: C.gold, stroke: '#2b1a08', strokeW: 14, shadow: 'rgba(0,0,0,0.5)', shadowY: 7 });
    },
    debug: function (stage) {
      if (stage === 'mid') { place(0); }
      if (stage === 'won') { place(0); place(1); place(2); }
    },
  });
})();

</script>
