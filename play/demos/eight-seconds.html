<script>
/* Playable-ad runtime shared by every game.
 *
 * Design space is 540x960 (the games' Godot viewport) with "expand" aspect:
 * the 540x960 safe area is centred and the visible area (PA.view) grows on
 * whichever axis the screen has extra room. Games draw in design units.
 *
 * A game registers itself with PA.register({ init, update, draw, down, move,
 * up, drawEndBg, debug }) and calls PA.win() when the payoff moment is done.
 * The runtime owns: canvas sizing, input, fonts/images/sounds, the persistent
 * INSTALL pill, the tutorial hand, popups/particles, the end card and the
 * network adapter (MRAID / Google ExitApi / local preview).
 */
(function () {
  'use strict';
  var CFG = window.PA_CFG || {};
  var AS = window.PA_ASSETS || { img: {}, snd: {} };
  var NET = CFG.net || 'preview';
  var THEME = CFG.theme || {};
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  var PA = (window.PA = {
    W: 540, H: 960, ctx: ctx, cfg: CFG, theme: THEME, net: NET,
    t: 0, img: {}, view: { x: 0, y: 0, w: 540, h: 960 },
    scale: 1, ox: 0, oy: 0, cssScale: 1,
    hand: null, started: false, ended: false, paused: false, interacted: false,
    DISPLAY: '"PA Display", "Arial Black", Impact, sans-serif',
    TEXT: '"PA Text", "Avenir Next", "Segoe UI", Roboto, Arial, sans-serif',
    HEAVY: '"PA Heavy", "PA Text", "Arial Black", sans-serif',
  });
  var game = null;

  // ---------------------------------------------------------------- utils
  PA.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  PA.lerp = function (a, b, t) { return a + (b - a) * t; };
  PA.rand = function (a, b) { return a + Math.random() * (b - a); };
  PA.ease = {
    outCubic: function (t) { t = PA.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); },
    inOutSine: function (t) { t = PA.clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { t = PA.clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: function (t) { t = PA.clamp(t, 0, 1); if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; },
  };
  PA.rr = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  PA.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['', 'K', 'M', 'B', 'T'], i = 0, v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.0+$/, '') + u[i];
  };
  // Draw an image to cover a rect (like CSS background-size: cover).
  // ax/ay pick which part survives the crop (0.5 = centre).
  PA.cover = function (c, im, x, y, w, h, ax, ay) {
    if (!im || !im.width) return;
    ax = ax == null ? 0.5 : ax; ay = ay == null ? 0.5 : ay;
    var s = Math.max(w / im.width, h / im.height);
    var dw = im.width * s, dh = im.height * s;
    c.drawImage(im, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
  };

  // Text with a chunky outline, the way the games style labels.
  PA.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var size = o.size || 32;
    var font = o.font || PA.HEAVY;
    c.save();
    c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font;
    if (o.maxW) {
      var w = c.measureText(str).width;
      if (w > o.maxW) { size = Math.floor(size * o.maxW / w); c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font; }
    }
    c.textAlign = o.align || 'center';
    c.textBaseline = o.base || 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    if (o.shadow) {
      c.fillStyle = o.shadow;
      if (o.stroke) { c.strokeStyle = o.shadow; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y + (o.shadowY || size * 0.09)); }
      c.fillText(str, x, y + (o.shadowY || size * 0.09));
    }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y); }
    if (o.grad) {
      var g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, o.grad[0]); g.addColorStop(1, o.grad[1]);
      c.fillStyle = g;
    } else c.fillStyle = o.color || '#fff';
    c.fillText(str, x, y);
    c.restore();
    return size;
  };

  // Chunky mobile-game button with a darker bottom lip.
  PA.button = function (x, y, w, h, label, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var press = o.press || 0;
    var lip = o.lip == null ? Math.round(h * 0.1) : o.lip;
    var r = o.r == null ? h * 0.28 : o.r;
    c.save();
    c.translate(x, y);
    if (o.scale) c.scale(o.scale, o.scale);
    var top = -h / 2 + press * lip;
    if (o.glow) {
      c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30;
    }
    c.fillStyle = o.lipColor || 'rgba(0,0,0,0.35)';
    PA.rr(c, -w / 2, -h / 2 + lip, w, h, r); c.fill();
    c.shadowBlur = 0;
    if (o.edge) {
      c.fillStyle = o.edge;
      PA.rr(c, -w / 2, top, w, h, r); c.fill();
    }
    var bw = o.edge ? (o.edgeW || 4) : 0;
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, o.top || o.fill || '#e07a35');
    g.addColorStop(1, o.fill || '#c85f22');
    c.fillStyle = g;
    PA.rr(c, -w / 2 + bw, top + bw, w - bw * 2, h - bw * 2, r - bw); c.fill();
    // gloss
    c.globalAlpha = 0.22;
    c.fillStyle = '#fff';
    PA.rr(c, -w / 2 + bw + 8, top + bw + 5, w - bw * 2 - 16, (h - bw * 2) * 0.36, (r - bw) * 0.8); c.fill();
    c.globalAlpha = 1;
    PA.text(label, 0, top + h / 2 + (o.textDy || 1), {
      ctx: c, size: o.size || h * 0.42, font: o.font || PA.HEAVY, color: o.color || '#fff',
      stroke: o.textStroke, strokeW: o.textStrokeW, shadow: o.textShadow === false ? null : (o.textShadow || 'rgba(0,0,0,0.25)'),
      shadowY: 2, maxW: w - 36,
    });
    c.restore();
  };

  // ---------------------------------------------------------------- fx
  var pops = [], parts = [], flyers = [];
  // Floating label: rises, pops in, fades.
  PA.pop = function (str, x, y, o) {
    o = o || {};
    pops.push({ s: str, x: x, y: y, t: 0, life: o.life || 0.9, size: o.size || 36, color: o.color || '#fff',
      stroke: o.stroke || 'rgba(0,0,0,0.85)', font: o.font || PA.HEAVY, rise: o.rise == null ? 70 : o.rise, grad: o.grad });
  };
  // Particle burst. o.shape: 'circle' | 'rect' | 'star' | function(c, p)
  PA.burst = function (x, y, n, o) {
    o = o || {};
    var cols = o.colors || ['#fff'];
    for (var i = 0; i < n; i++) {
      var a = o.angle != null ? o.angle + PA.rand(-o.spread, o.spread) : PA.rand(0, Math.PI * 2);
      var sp = PA.rand(o.speedMin || 120, o.speed || 420);

      tilt: 0, tiltT: 0, ty: 0, shake: 0, kick: 0, anim: 0, dust: [],

  // ---------------------------------------------------------------- bull (port of BullSprite.gd)
  function bull(c, w, h, faceRight, gait) {
    var gw = 32, gh = 24, px = Math.min(w / gw, h / gh);
    var dw = px * gw, dh = px * gh, ox = (w - dw) / 2, oy = (h - dh) / 2;

    var hoof = '#0f0805', horn = '#f2ebc7', hornTip = '#4d2e14', eye = '#f2331a', nose = '#d98c73';
    pix(5, 22, 22, 1, 'rgba(0,0,0,0.25)'); pix(4, 23, 24, 1, 'rgba(0,0,0,0.15)');
    pix(5, 8, 21, 1, '#432310'); pix(5, 9, 21, 1, shade); pix(4, 10, 23, 6, body);
    pix(6, 10, 8, 2, shade); pix(15, 10, 6, 2, belly); pix(4, 16, 23, 1, shade); pix(5, 17, 21, 1, belly);
    pix(12, 12, 4, 3, '#5b3016'); pix(7, 11, 16, 1, '#603217'); pix(16, 10, 2, 1, 'rgba(255,255,255,0.12)');
    pix(17, 6, 5, 4, body); pix(18, 5, 3, 1, body); pix(19, 4, 1, 1, body);
    pix(17, 6, 5, 1, belly); pix(18, 5, 3, 1, belly); pix(17, 9, 5, 1, shade);
    pix(19, 4, 1, 1, 'rgba(255,255,255,0.25)'); pix(18, 5, 1, 1, 'rgba(255,255,255,0.15)');
    pix(23, 16, 3, 2, shade); pix(24, 18, 2, 1, '#3d1f0e');
    var hy = 9;
    pix(22, hy, 6, 7, body); pix(22, hy, 6, 1, belly); pix(23, hy + 1, 4, 1, '#734125'); pix(22, hy + 6, 6, 1, shade);
    pix(27, hy + 3, 3, 4, '#7f5034'); pix(29, hy + 4, 1, 2, nose);
    pix(28, hy + 4, 1, 1, dark); pix(28, hy + 5, 1, 1, dark); pix(27, hy + 6, 3, 1, dark);
    pix(25, hy + 1, 2, 2, '#f2e6cc'); pix(25, hy + 1, 1, 1, eye); pix(25, hy + 2, 1, 1, '#c22915'); pix(26, hy + 1, 1, 1, '#0d0500');
    var hm = '#a08d6d';
    pix(25, hy - 1, 1, 1, horn); pix(26, hy - 2, 1, 1, horn); pix(27, hy - 3, 1, 1, horn); pix(28, hy - 3, 1, 1, hm);
    pix(29, hy - 4, 1, 1, hornTip); pix(30, hy - 4, 1, 1, hornTip);
    pix(22, hy - 1, 1, 1, horn); pix(21, hy - 2, 1, 1, horn); pix(20, hy - 3, 1, 1, horn); pix(19, hy - 3, 1, 1, hm);
    pix(18, hy - 4, 1, 1, hornTip); pix(22, hy, 6, 1, dark);
    pix(23, hy, 1, 2, dark); pix(24, hy, 1, 1, '#ae705c');
    var lt = 16, lh = 5, lk = 0;
    if (S.kick > 0) lk = Math.floor(S.kick / 0.35 * 3);
    if (gait === 'bucking') { var s2 = Math.sin(S.anim * 5); if (s2 > 0.4) lk = Math.max(lk, Math.floor((s2 - 0.4) * 5)); }
    [5, 9].forEach(function (x) { pix(x, lt, 2, lh, body); pix(x, lt + 2, 2, 1, shade); pix(x, lt + lh - 1, 2, 1, hoof); });
    var ft = lt - lk, fh = Math.max(2, lh - lk);
    [17, 21].forEach(function (x) { pix(x, ft, 2, fh, body); if (fh > 3) pix(x, ft + 2, 2, 1, shade); pix(x, ft + fh - 1, 2, 1, hoof); });
    var sway = gait === 'bucking' ? Math.trunc(Math.sin(S.anim * 7) * 2) : 0;
    pix(3, 10, 1, 2, dark); pix(3 + sway, 12, 1, 3, dark); pix(2 + sway, 15, 2, 2, dark);
    // snort puffs
    var ph0 = (S.anim * 1.4) % 1;
    for (var i = 0; i < 4; i++) {
      var ph = (ph0 + i * 0.25) % 1;
      var x = faceRight ? ox + (30 + ph * 7) * px : ox + (2 - ph * 7) * px;
      var y = oy + (hy + 4) * px - ph * px * 2.5, r = px * (1.2 + ph * 2);

    }

  }

  // ---------------------------------------------------------------- arrow (port of SwipeArrow.gd)
  function arrow(c) {
    if (!S.arrowMode) return;
    var now = S.arrowMode === 2, col = now ? GOOD : GOLD, RAD = 92;
    var pulse = 1 + (now ? 0.08 * Math.sin(PA.t * 25) : 0);
    c.save();
    c.translate(ARROW.x, ARROW.y);
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.beginPath(); c.arc(0, 0, RAD + 10, 0, 6.283); c.fill();
    c.lineWidth = 10; c.strokeStyle = now ? 'rgba(140,242,140,0.25)' : 'rgba(247,212,87,0.25)';
    c.beginPath(); c.arc(0, 0, RAD, 0, 6.283); c.stroke();
    if (S.arrowProg > 0) {
      var st = -Math.PI / 2 - Math.PI * S.arrowProg;
      c.strokeStyle = col; c.beginPath(); c.arc(0, 0, RAD, st, st + Math.PI * 2 * S.arrowProg); c.stroke();
    }
    var d = S.arrowDir, n = [-d[1], d[0]];
    c.globalAlpha = now ? 1 : 0.75;
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 20 * pulse; c.lineCap = 'butt';
    var tail = [-d[0] * 52 * pulse, -d[1] * 52 * pulse], tip = [d[0] * 58 * pulse, d[1] * 58 * pulse];
    var neck = [tip[0] - d[0] * 34 * pulse, tip[1] - d[1] * 34 * pulse];
    c.beginPath(); c.moveTo(tail[0], tail[1]); c.lineTo(neck[0], neck[1]); c.stroke();
    c.beginPath(); c.moveTo(tip[0], tip[1]);
    c.lineTo(neck[0] + n[0] * 30 * pulse, neck[1] + n[1] * 30 * pulse);
    c.lineTo(neck[0] - n[0] * 30 * pulse, neck[1] - n[1] * 30 * pulse);
    c.closePath(); c.fill();
    c.restore();
  }

  // ---------------------------------------------------------------- dust (port of DustBurst.gd)
  function dust(n, spread) {
    for (var i = 0; i < n; i++) {
      var a = PA.rand(Math.PI * 0.85, Math.PI * 2.15), sp = PA.rand(spread * 0.3, spread), layer = (Math.random() * 3) | 0;
      S.dust.push({ x: ANIMAL.x + PA.rand(-60, 60), y: ANIMAL.y + PA.rand(-4, 4), vx: Math.cos(a) * sp * (0.6 + layer * 0.2),
        vy: Math.sin(a) * sp * 0.45, r: PA.rand(3, 7 + layer * 3), t: 0, layer: layer });
    }
  }

  // ---------------------------------------------------------------- flow
  function startRide() {
    S.state = 'ride';
    S.everHeld = true;
    PA.sfx('go', 0.5);
  }
  function buckFx(d) {
    S.tiltT = -d[0] * 1.4; // bull throws opposite to the swipe
    S.ty = -d[1] * 1.4;
    S.shake = 0.12;
    S.kick = 0.35;
    dust(16, 260);
    PA.sfx('buck', 0.55);
  }
  function resolve(g) {
    var G = GRADE[g];
    S.active = false;
    S.arrowMode = 0;
    S.meter = PA.clamp(S.meter + G[3], 0, 100);
    S.quality += g === 'excellent' ? 1 : g === 'good' ? 0.7 : g === 'okay' ? 0.4 : 0;
    PA.pop(G[0], POPUP.x, POPUP.y, { color: G[1], size: G[2], life: 0.95 });
    if (g === 'excellent' || g === 'good') {
      S.good++;
      PA.sfx('perfect', 0.6);
      PA.burst(ARROW.x, ARROW.y, 18, { colors: [GOOD, '#fff', GOLD], shape: 'star', size: 11, speed: 520, gravity: 600, life: 0.7 });
    }
    S.bi++;
    if (S.meter <= 0) { S.state = 'fallen'; S.wonT = 0; S.holding = false; PA.hand = null; }
  }
  function win() {
    S.state = 'won';
    S.wonT = 0;
    S.flash = 1;
    S.arrowMode = 0;
    S.active = false;
    PA.hand = null;
    PA.sfx('milestone', 0.8);
    PA.burst(270, 300, 70, { colors: [GOLD, '#fff3b0', '#e8843f', GOOD, '#fff'], shape: 'rect', size: 16, speed: 760, gravity: 900, life: 1.6, drag: 0.6 });
    PA.burst(270, 300, 26, { colors: [GOLD, '#fff'], shape: 'star', size: 14, speed: 520, gravity: 300, life: 1.2 });
    var quality = S.quality / BUCKS.length;
    S.stars = quality >= 0.75 ? 3 : quality >= 0.5 ? 2 : 1;
    S.seconds += 8 + S.stars * 10;
    if (S.level < 3) S.state = 'round';
    else PA.win(2.4);
  }
  function nextRide() {
    var level = S.level + (S.state === 'round' ? 1 : 0), seconds = S.seconds;
    reset(); S.level = level; S.seconds = seconds;
    TELE = [0, 0.85, 0.65, 0.48][level];
    WIN = [0, 1.0, 0.78, 0.60][level];
    BUCKS = level === 1 ? [{t:1,dir:L},{t:2.9,dir:R},{t:4.8,dir:U},{t:6.7,dir:L}]
      : level === 2 ? [{t:0.9,dir:R},{t:2.3,dir:U},{t:3.7,dir:L},{t:5.1,dir:R},{t:6.5,dir:U}]

  function snap8(dx, dy) {

    }
    resolve(g);
  }

  function update(dt) {
    S.anim += dt;
    // tilt / shake easing (EndlessRide._animate)
    S.tiltT = PA.lerp(S.tiltT, 0, Math.min(1, dt * 4));
    S.ty = PA.lerp(S.ty, 0, Math.min(1, dt * 4));
    S.tilt = PA.lerp(S.tilt, S.tiltT, Math.min(1, dt * 12));
    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
    if (S.kick > 0) S.kick = Math.max(0, S.kick - dt);
    for (var i = S.dust.length - 1; i >= 0; i--) {
      var p = S.dust[i];
      p.t += dt;

      var dr = 1 - 1.8 * dt; p.vx *= dr; p.vy *= dr; p.vy += 60 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += (14 + p.layer * 4) * dt;

    S.logoA = PA.clamp(S.logoA + (S.state === 'wait' ? dt : -dt) * 3, 0, 1);

    if (S.state === 'won' || S.state === 'round' || S.state === 'fallen') {
      S.wonT += dt;

      }

    // The current game advances freely: no holding required between flicks.
    S.t += dt;
    S.meter = Math.max(0, S.meter - dt * (1 + S.level));
    if(S.meter<=0){S.state='fallen';S.wonT=0;S.holding=false;PA.hand=null;return;}

  // Tutorial hand: press where to hold, then demonstrate each swipe.
  function tutorial(dt) {
    if (S.state === 'wait') {

    } else PA.hand = null;
  }

  // ---------------------------------------------------------------- draw
  function draw(c, v) {
    PA.cover(c, PA.img.arena, v.x, v.y, v.w, v.h, 0.5, 0.5);
    // bull + rider
    c.save();
    var jx = 0, jy = 0;
    if (S.shake > 0) { jx = PA.rand(-6, 6) * S.shake / 0.12; jy = PA.rand(-6, 6) * S.shake / 0.12; }
    c.translate(ANIMAL.x + jx, ANIMAL.y + S.ty * 22 + jy);
    c.rotate(PA.clamp(S.tilt * 0.22, -0.3, 0.3));
    var gait = S.state === 'wait' ? 'idle' : 'bucking';
    c.translate(-160, -252);
    var rear = bull(c, 320, 252, false, gait);
    // rider on the shoulder hump (bull faces left: hump ~36% across)
    var rim = PA.img.rider;
    if (rim && rim.width) {
      c.imageSmoothingEnabled = false;
      var bob = S.state === 'won' ? -Math.abs(Math.sin(PA.t * 9)) * 10 : 0;
      c.drawImage(rim, 320 * 0.36 - 40 + 3, 252 * 0.30 - 106 + 18 + rear + bob, 74, 106);
      c.imageSmoothingEnabled = true;

    c.restore();

      var p = S.dust[i], life = p.t / 0.55, a = (1 - life * life) * 0.8;

      c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(217,166,102,' + (a * 0.4) + ')';
      c.beginPath(); c.arc(p.x + p.r * 0.2, p.y - p.r * 0.2, p.r * 0.4, 0, 6.283); c.fill();
    }
    arrow(c);
    hud(c, v);
    if (S.flash > 0) { c.fillStyle = 'rgba(255,248,220,' + (S.flash * 0.55) + ')'; c.fillRect(v.x, v.y, v.w, v.h); }
  }

  function hud(c, v) {
    var top = v.y + 18, left = Math.max(v.x, 0) + 16, right = Math.min(v.x + v.w - 156, 540 - 16);
    // BALANCE caption + bar

    var bx = left + 88, bw = Math.max(80, right - bx), bh = 22;
    c.fillStyle = 'rgba(16,10,5,0.75)'; PA.rr(c, bx, top + 2, bw, bh, 7); c.fill();
    var low = S.meter <= 30;
    c.fillStyle = low ? '#f2594d' : GOLD;
    PA.rr(c, bx + 3, top + 5, Math.max(10, (bw - 6) * S.meter / 100), bh - 6, 5); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.25)'; c.fillRect(bx + 6, top + 6, Math.max(4, (bw - 12) * S.meter / 100), 3);

    PA.text(S.t.toFixed(2), 0, 0, { size: 60, font: PA.HEAVY, color: won ? GOOD : GOLD, stroke: 'rgba(0,0,0,0.8)', strokeW: 10 });
    c.restore();

      var ly = ARROW.y - 40;
      PA.text('EIGHT', 270, ly - 40, { size: 84, font: PA.DISPLAY, color: GOLD, stroke: '#331709', strokeW: 16, shadow: 'rgba(0,0,0,0.45)', shadowY: 6 });
      PA.text('SECONDS', 270, ly + 44, { size: 84, font: PA.DISPLAY, color: GOLD, stroke: '#331709', strokeW: 16, shadow: 'rgba(0,0,0,0.45)', shadowY: 6, maxW: 500 });
      PA.text('Three bulls. Eight seconds. One thumb.', 270, ly + 112, { size: 26, font: PA.HEAVY, color: CREAM, stroke: '#331709', strokeW: 7 });
      c.restore();
    }
    // prompts
    var by = v.y + v.h;
    if (S.state === 'wait') {
      var l1 = S.state === 'wait' ? 'TAP TO RIDE' : 'FLICK ON GREEN';
      var l2 = S.state === 'wait' ? 'THEN FLICK ON GREEN' : 'LIFT YOUR THUMB FREELY';
      var pk = 1 + 0.04 * Math.sin(PA.t * 5);
      c.save(); c.translate(270, Math.min(by - 214, 760)); c.scale(pk, pk);
      PA.text(l1, 0, -20, { size: 34, font: PA.HEAVY, color: GOLD, stroke: 'rgba(0,0,0,0.9)', strokeW: 9, maxW: 500 });
      PA.text(l2, 0, 22, { size: 34, font: PA.HEAVY, color: GOLD, stroke: 'rgba(0,0,0,0.9)', strokeW: 9, maxW: 500 });
      c.restore();
    }
    if (S.state === 'ride' && S.active && S.good < 2) {
      PA.text('SWIPE THE WAY IT POINTS!', 270, ARROW.y - 138, { size: 28, font: PA.HEAVY, color: GOOD, stroke: 'rgba(0,0,0,0.9)', strokeW: 8, maxW: 500 });
    }
    PA.text('FLICK ON GREEN · NO HOLDING NEEDED', 270, by - 26, { size: 19, font: PA.HEAVY, color: GOLD, stroke: 'rgba(0,0,0,0.85)', strokeW: 5, maxW: 510 });
    PA.text('LEVEL ' + S.level + ' / 3   |   ' + S.seconds + ' SECONDS', 270, top + 128, {size:22,color:CREAM,stroke:'#331709',strokeW:5});
    if (S.state === 'round' || S.state === 'fallen') {

      PA.text(S.state === 'fallen' ? 'Misses cost balance. Try again.' : S.stars + ' STARS · ' + S.seconds + ' SECONDS EARNED',270,350,{size:24,color:CREAM,stroke:'#331709',strokeW:6,maxW:500});
      PA.button(270,790,420,82,S.state === 'fallen' ? 'TRY AGAIN' : 'NEXT BULL',{fill:'#bd582c',top:'#e8843f',edge:GOLD,size:32});
    }

      var k = PA.ease.outBack(Math.min(1, S.wonT / 0.5));
      c.save(); c.translate(270, 318); c.scale(k, k); c.rotate(-0.04);
      c.fillStyle = 'rgba(30,16,6,0.82)';
      PA.rr(c, -250, -96, 500, 196, 26); c.fill();
      c.lineWidth = 5; c.strokeStyle = GOLD; PA.rr(c, -250, -96, 500, 196, 26); c.stroke();

      PA.text('QUALIFIED!', 0, 52, { size: 44, font: PA.HEAVY, color: GOOD, stroke: 'rgba(0,0,0,0.9)', strokeW: 10 });

    }
  }

  // ---------------------------------------------------------------- input
  function down(x, y, id) {
    if (S.state === 'won') return;
    if (S.state === 'round' || S.state === 'fallen') { if (y > 740 && y < 840) nextRide(); return; }
    if (S.holding) return; // ignore a second finger
    S.holding = true; S.pid = id; S.ax = S.px = x; S.ay = S.py = y;
    if (S.state === 'wait') startRide();
  }
  function move(x, y, id) {
    if (!S.holding || id !== S.pid) return;
    S.px = x; S.py = y;
    var dx = x - S.ax, dy = y - S.ay;
    if (dx * dx + dy * dy >= 34 * 34) {
      onSwipe(dx, dy);
      S.ax = x; S.ay = y;   // re-arm
    }
  }
  function up(x, y, id) {
    if (id !== S.pid) return;
    S.holding = false; S.pid = null;
  }

  PA.register({
    init: reset,
    inspect: function () { return {state:S.state,level:S.level,time:S.t,meter:S.meter,seconds:S.seconds,stars:S.stars,active:S.active,dir:S.arrowDir.slice(),holding:S.holding}; },
    update: update,
    draw: draw,
    down: down, move: move, up: up,
    cancel: function (id) { if (S.pid === id) S.holding = false; },
    drawEndBg: function (c, v) { PA.cover(c, PA.img.home, v.x, v.y, v.w, v.h, 0.5, 0.6); },
    drawEndTitle: function (c, x, y) {
      PA.text('EIGHT SECONDS', x, y, { size: 66, font: PA.DISPLAY, color: GOLD, stroke: '#331709', strokeW: 14, shadow: 'rgba(0,0,0,0.5)', shadowY: 6, maxW: 510 });
    },
    // preview-only: jump to a stage for screenshots
    debug: function (stage) {
      if (stage === 'mid') { S.state = 'ride'; S.holding = true; S.t = 2.95; S.bi = 1; S.good = 0; S.px = 270; S.py = 790; }
      if (stage === 'won') { S.state = 'ride'; S.holding = true; S.t = 7.99; S.bi = 4; }
    },
  });
})();

</script>
