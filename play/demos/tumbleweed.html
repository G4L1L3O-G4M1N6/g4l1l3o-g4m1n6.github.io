<script>
/* Playable-ad runtime shared by every game.
 *
 * Design space is 540x960 (the games' Godot viewport) with "expand" aspect:
 * the 540x960 safe area is centred and the visible area (PA.view) grows on
 * whichever axis the screen has extra room. Games draw in design units.
 *
 * A game registers itself with PA.register({ init, update, draw, down, move,
 * up, drawEndBg, debug }) and calls PA.win() when the payoff moment is done.
 * The runtime owns: canvas sizing, input, fonts/images/sounds, the persistent
 * INSTALL pill, the tutorial hand, popups/particles, the end card and the
 * network adapter (MRAID / Google ExitApi / local preview).
 */
(function () {
  'use strict';
  var CFG = window.PA_CFG || {};
  var AS = window.PA_ASSETS || { img: {}, snd: {} };
  var NET = CFG.net || 'preview';
  var THEME = CFG.theme || {};
  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');

  var PA = (window.PA = {
    W: 540, H: 960, ctx: ctx, cfg: CFG, theme: THEME, net: NET,
    t: 0, img: {}, view: { x: 0, y: 0, w: 540, h: 960 },
    scale: 1, ox: 0, oy: 0, cssScale: 1,
    hand: null, started: false, ended: false, paused: false, interacted: false,
    DISPLAY: '"PA Display", "Arial Black", Impact, sans-serif',
    TEXT: '"PA Text", "Avenir Next", "Segoe UI", Roboto, Arial, sans-serif',
    HEAVY: '"PA Heavy", "PA Text", "Arial Black", sans-serif',
  });
  var game = null;

  // ---------------------------------------------------------------- utils
  PA.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  PA.lerp = function (a, b, t) { return a + (b - a) * t; };
  PA.rand = function (a, b) { return a + Math.random() * (b - a); };
  PA.ease = {
    outCubic: function (t) { t = PA.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); },
    inOutSine: function (t) { t = PA.clamp(t, 0, 1); return -(Math.cos(Math.PI * t) - 1) / 2; },
    outBack: function (t) { t = PA.clamp(t, 0, 1); var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: function (t) { t = PA.clamp(t, 0, 1); if (t === 0 || t === 1) return t; return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1; },
  };
  PA.rr = function (c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };
  PA.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    var u = ['', 'K', 'M', 'B', 'T'], i = 0, v = n;
    while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)).replace(/\.0+$/, '') + u[i];
  };
  // Draw an image to cover a rect (like CSS background-size: cover).
  // ax/ay pick which part survives the crop (0.5 = centre).
  PA.cover = function (c, im, x, y, w, h, ax, ay) {
    if (!im || !im.width) return;
    ax = ax == null ? 0.5 : ax; ay = ay == null ? 0.5 : ay;
    var s = Math.max(w / im.width, h / im.height);
    var dw = im.width * s, dh = im.height * s;
    c.drawImage(im, x + (w - dw) * ax, y + (h - dh) * ay, dw, dh);
  };

  // Text with a chunky outline, the way the games style labels.
  PA.text = function (str, x, y, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var size = o.size || 32;
    var font = o.font || PA.HEAVY;
    c.save();
    c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font;
    if (o.maxW) {
      var w = c.measureText(str).width;
      if (w > o.maxW) { size = Math.floor(size * o.maxW / w); c.font = (o.weight ? o.weight + ' ' : '') + size + 'px ' + font; }
    }
    c.textAlign = o.align || 'center';
    c.textBaseline = o.base || 'middle';
    c.lineJoin = 'round';
    c.miterLimit = 2;
    if (o.alpha != null) c.globalAlpha *= o.alpha;
    if (o.shadow) {
      c.fillStyle = o.shadow;
      if (o.stroke) { c.strokeStyle = o.shadow; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y + (o.shadowY || size * 0.09)); }
      c.fillText(str, x, y + (o.shadowY || size * 0.09));
    }
    if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.strokeW || size * 0.18; c.strokeText(str, x, y); }
    if (o.grad) {
      var g = c.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, o.grad[0]); g.addColorStop(1, o.grad[1]);
      c.fillStyle = g;
    } else c.fillStyle = o.color || '#fff';
    c.fillText(str, x, y);
    c.restore();
    return size;
  };

  // Chunky mobile-game button with a darker bottom lip.
  PA.button = function (x, y, w, h, label, o) {
    o = o || {};
    var c = o.ctx || ctx;
    var press = o.press || 0;
    var lip = o.lip == null ? Math.round(h * 0.1) : o.lip;
    var r = o.r == null ? h * 0.28 : o.r;
    c.save();
    c.translate(x, y);
    if (o.scale) c.scale(o.scale, o.scale);
    var top = -h / 2 + press * lip;
    if (o.glow) {
      c.shadowColor = o.glow; c.shadowBlur = o.glowBlur || 30;
    }
    c.fillStyle = o.lipColor || 'rgba(0,0,0,0.35)';
    PA.rr(c, -w / 2, -h / 2 + lip, w, h, r); c.fill();
    c.shadowBlur = 0;
    if (o.edge) {
      c.fillStyle = o.edge;
      PA.rr(c, -w / 2, top, w, h, r); c.fill();
    }
    var bw = o.edge ? (o.edgeW || 4) : 0;
    var g = c.createLinearGradient(0, top, 0, top + h);
    g.addColorStop(0, o.top || o.fill || '#e07a35');
    g.addColorStop(1, o.fill || '#c85f22');
    c.fillStyle = g;
    PA.rr(c, -w / 2 + bw, top + bw, w - bw * 2, h - bw * 2, r - bw); c.fill();
    // gloss
    c.globalAlpha = 0.22;
    c.fillStyle = '#fff';
    PA.rr(c, -w / 2 + bw + 8, top + bw + 5, w - bw * 2 - 16, (h - bw * 2) * 0.36, (r - bw) * 0.8); c.fill();
    c.globalAlpha = 1;
    PA.text(label, 0, top + h / 2 + (o.textDy || 1), {
      ctx: c, size: o.size || h * 0.42, font: o.font || PA.HEAVY, color: o.color || '#fff',
      stroke: o.textStroke, strokeW: o.textStrokeW, shadow: o.textShadow === false ? null : (o.textShadow || 'rgba(0,0,0,0.25)'),
      shadowY: 2, maxW: w - 36,
    });
    c.restore();
  };

  // ---------------------------------------------------------------- fx
  var pops = [], parts = [], flyers = [];
  // Floating label: rises, pops in, fades.
  PA.pop = function (str, x, y, o) {
    o = o || {};
    pops.push({ s: str, x: x, y: y, t: 0, life: o.life || 0.9, size: o.size || 36, color: o.color || '#fff',
      stroke: o.stroke || 'rgba(0,0,0,0.85)', font: o.font || PA.HEAVY, rise: o.rise == null ? 70 : o.rise, grad: o.grad });
  };
  // Particle burst. o.shape: 'circle' | 'rect' | 'star' | function(c, p)
  PA.burst = function (x, y, n, o) {
    o = o || {};
    var cols = o.colors || ['#fff'];
    for (var i = 0; i < n; i++) {
      var a = o.angle != null ? o.angle + PA.rand(-o.spread, o.spread) : PA.rand(0, Math.PI * 2);
      var sp = PA.rand(o.speedMin || 120, o.speed || 420);
      parts.push({ x: x + PA.rand(-(o.jitter || 0), o.jitter || 0), y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        g: o.gravity == null ? 900 : o.gravity, drag: o.drag || 0, t: 0, life: PA.rand((o.life || 0.9) * 0.7, o.life || 0.9),
        size: PA.rand(o.sizeMin || 4, o.size || 10), grow: o.grow || 0, color: cols[(Math.random() * cols.length) | 0],
        rot: PA.rand(0, 6.28), vr: PA.rand(-10, 10), shape: o.shape || 'circle', fade: o.fade !== false });
    }
  };
  // Something flies from A to B on an arc, then onArrive fires.
  PA.fly = function (x0, y0, x1, y1, o) {
    o = o || {};
    flyers.push({ x0: x0, y0: y0, x1: x1, y1: y1, t: -(o.delay || 0), dur: o.dur || 0.6, draw: o.draw,
      arc: o.arc == null ? -120 : o.arc, cb: o.onArrive, size: o.size || 1 });
  };
  function star(c, r) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rr = i % 2 ? r * 0.45 : r, a = -Math.PI / 2 + i * Math.PI / 5;

  // Subtle touch cue: no cursor glove obscuring the game. The existing

  PA.drawHand = function (x, y, o) {
    o = o || {};
    var c = ctx, pulse = (PA.t * 1.4) % 1, r = (o.press ? 13 : 17) * (o.scale || 1);
    c.save();

  }
  PA.sfx = function (name, vol, rate) {

  // ---------------------------------------------------------------- network / CTA

  };
  var toast = null;
  window.__ctaLog = [];
  PA.cta = function () {
    PA.sfx('click', 0.6);
    var url = PA.storeUrl();
    window.__ctaLog.push({ net: NET, url: url, t: +PA.t.toFixed(2) });
    try {
      if (NET === 'mraid') {
        if (window.mraid && typeof mraid.open === 'function') mraid.open(url);
        else window.open(url, '_blank');

  };

  // ---------------------------------------------------------------- layout

  }

  // ---------------------------------------------------------------- install pill
  function pillRect() {

  }
  function drawPill() {

      fill: THEME.cta || '#d9732f', top: THEME.ctaTop || THEME.cta, edge: THEME.ctaEdge, edgeW: 3, size: 20,
      color: THEME.ctaText || '#fff', r: 23, lip: 4, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: 1 + 0.04 * Math.sin(PA.t * 4),

  }

  // ---------------------------------------------------------------- end card

  // Called by the game when the payoff is done; the end card follows `delay` s later.

  };

    c.shadowColor = 'transparent';

    if (game && game.drawEndTitle) game.drawEndTitle(c, 270, ny);

    wrapText(CFG.pitch, 270, ny + (THEME.pitchDy || 74), 470, 28, { size: 25, font: PA.TEXT, color: THEME.pitch || '#fbefd6', stroke: 'rgba(0,0,0,0.55)', strokeW: 6 });

    var bk = PA.ease.outBack((endT - 0.4) / 0.45);
    if (endT > 0.4) {
      PA.button(b.x, b.y, b.w, b.h, THEME.ctaLabel || 'PLAY FREE', {
        fill: THEME.cta || '#d9732f', top: THEME.ctaTop || THEME.cta, edge: THEME.ctaEdge, edgeW: 5,
        color: THEME.ctaText || '#fff', size: 46, font: THEME.ctaFont === 'display' ? PA.DISPLAY : PA.HEAVY, scale: bk * (1 + 0.05 * Math.sin(PA.t * 5.5)),
        glow: THEME.ctaGlow || 'rgba(255,190,80,0.6)', glowBlur: 34,

  function wrapText(str, x, y, maxW, lh, o) {

    PA.dt = dt;
    PA.t += dt;
    if (PA.started && !PA.ended) {

    var onReady = function () {
      try { mraid.addEventListener('viewableChange', onViewable); } catch (e) {}

    POLE: [0.97, 0.92, 0.84], FLAG: [0.93, 0.42, 0.36], TEE: [0.97, 0.88, 0.72], WEED_LIGHT: [0.90, 0.74, 0.50],
    WEED_DARK: [0.52, 0.34, 0.24], DUST: [0.93, 0.78, 0.62], AIM: [1.0, 0.94, 0.84], AIM_HOT: [0.98, 0.55, 0.42],
    CREAM: [0.99, 0.94, 0.86], SAND: [0.95, 0.80, 0.64], ACCENT: [0.86, 0.48, 0.38], ACCENT_BRIGHT: [0.98, 0.70, 0.52], PLUM: [0.30, 0.20, 0.27],

    for (var i = 0; i < 9; i++) { var x = 10 + r() * (WIDTH - 20); if (Math.abs(x - CUP_X) < 34 || Math.abs(x - TEE[0]) < 26) continue; out.push([x, heightAt(x) + 1, 5 + r() * 4]); }
    return out;
  })();
  function surfaceLine(c, off) {
    c.beginPath();
    var first = true;
    function to(x, y) { if (first) { c.moveTo(x, y); first = false; } else c.lineTo(x, y); }
    EXT_L.forEach(function (p) { to(p[0], p[1] + off + Math.sin(p[0] * 0.031) * off * 0.08); });
    PTS.forEach(function (p) {
      var y = p[1];
      if (p[0] >= CUP_X - CUP_W / 2 - 0.01 && p[0] <= CUP_X + CUP_W / 2 + 0.01) y = RIM_Y;
      to(p[0], y + off + Math.sin(p[0] * 0.031) * off * 0.08);
    });
    EXT_R.forEach(function (p) { to(p[0], p[1] + off + Math.sin(p[0] * 0.031) * off * 0.08); });
  }
  function drawGround(c) {
    var topC = mix(P.GROUND_TOP, P.GROUND_RIM, 0.10);
    var g = c.createLinearGradient(0, 590, 0, 1500);
    g.addColorStop(0, mc(topC)); g.addColorStop(0.09, pc('GROUND_TOP')); g.addColorStop(1, pc('GROUND_DEEP'));
    surfaceLine(c, 0);
    c.lineTo(2000, 1500); c.lineTo(-1400, 1500); c.closePath();
    c.fillStyle = g; c.fill();
    // strata
    c.lineWidth = 1.5;
    [[30, 0.07], [78, 0.05], [150, 0.035]].forEach(function (l) { surfaceLine(c, l[0]); c.strokeStyle = pc('GROUND_RIM', l[1]); c.stroke(); });
    // cup
    c.fillStyle = pc('CUP'); c.fillRect(CUP_X - CUP_W / 2, RIM_Y - 0.5, CUP_W, LIP + CUP_DEPTH - RIM_Y + 0.5);
    // tufts
    c.strokeStyle = pc('GROUND_RIM', 0.55); c.lineWidth = 1;
    TUFTS.forEach(function (t) {
      c.beginPath();
      for (var k = -2; k <= 2; k++) { c.moveTo(t[0] + k * 1.4, t[1]); c.lineTo(t[0] + k * 1.4 + k * 1.6, t[1] - t[2] * (1 - Math.abs(k) * 0.18)); }
      c.stroke();
    });
    // last light along the surface (the cup notch is skipped)
    c.lineCap = 'round'; c.lineJoin = 'round';
    var lpts = EXT_L.concat(PTS.filter(function (p) { return p[0] <= CUP_X - CUP_W / 2 + 0.01 && p[1] < LIP + 1 || p[0] < CUP_X - CUP_W; }));
    var rpts = PTS.filter(function (p) { return p[0] >= CUP_X + CUP_W / 2 - 0.01 && p[1] < LIP + 1 || p[0] > CUP_X + CUP_W; }).concat(EXT_R);
    [[7, 0.14], [2.2, 0.9]].forEach(function (s) {
      c.strokeStyle = pc('GROUND_RIM', s[1]); c.lineWidth = s[0];
      [lpts, rpts].forEach(function (line) { c.beginPath(); line.forEach(function (p, i) { if (i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); }); c.stroke(); });
    });
    // tee stone
    c.fillStyle = pc('TEE', 0.8); c.fillRect(TEE[0] - 9, H.teeGround - 1, 18, 3);
  }
  function drawFlag(c) {
    var lift = S.flagLift * 26, base = LIP + CUP_DEPTH - 2 - lift, top = LIP - 74 - lift;
    c.strokeStyle = pc('POLE', 0.95); c.lineWidth = 2;
    c.beginPath(); c.moveTo(CUP_X, base); c.lineTo(CUP_X, top); c.stroke();
    var w = 34, h = 22, seg = 8, i, f, wave;
    c.fillStyle = pc('FLAG'); c.beginPath();
    for (i = 0; i <= seg; i++) { f = i / seg; wave = Math.sin(PA.t * 2.2 - f * 3.4 + 1) * 2.6 * f; c.lineTo(CUP_X + f * w, top + f * h * 0.5 + wave); }
    for (i = seg; i >= 0; i--) { f = i / seg; wave = Math.sin(PA.t * 2.2 - f * 3.4 + 1) * 2.6 * f; c.lineTo(CUP_X + f * w, top + h - f * h * 0.5 + wave); }
    c.closePath(); c.fill();
    PA.text('1', CUP_X + 12, top + h * 0.5 + 1, { ctx: c, size: 12, font: PA.DISPLAY, color: pc('CREAM', 0.9) });
  }

  // ---------------------------------------------------------------- state
  var S;
  function reset(run) {
    run=run||{hole:1,lives:3,skulls:0,perk:''};configureHole(run.hole,run.perk);
    S = {hole:run.hole,lives:run.lives,skulls:run.skulls,perk:run.perk,skull:null,skullPlaced:false,
 phase: 'aim', ball: newBall(TEE[0], TEE[1]), shotStart: TEE.slice(), strokes: 0, acc: 0,
      drag: null, snap: null, puffs: [], lastLand: -1, flagLift: 0, sinkT: -1, sinkFrom: null, fade: 1,
      titleA: 1, msg: '', msgT: 9, idle: 0, demoT: 0, wonT: 0, glow: 0, outT: -1, everDragged: false };
    startSolve(TEE[0], TEE[1]);
  }
  function say(m) { S.msg = m; S.msgT = 0; }

  // Assist tolerance: first throw must be roughly right; retries snap freely.
  function tolA() { return S.hole===1?18:7; }
  function tolL() { return S.hole===1?45:22; }
  function shoot(drag) {
    var sn = nearest(drag, tolA(), tolL());
    var v = sn ? velForDrag(sn.drag[0], sn.drag[1]) : velForDrag(drag[0], drag[1]);
    if (!v) return;
    S.strokes++;
    S.shotStart = [S.ball.x, S.ball.y];
    launch(S.ball, v);
    S.phase = 'fly'; S.acc = 0;
    PA.sfx('throw', 0.5, PA.rand(0.95, 1.08));
  }
  function puff(x, y, strength) {
    var n = PA.clamp(Math.floor(strength / 60) + 3, 3, 9);
    for (var i = 0; i < n; i++) {
      var dx = PA.rand(-1, 1), dy = PA.rand(-0.9, -0.15), l = Math.sqrt(dx * dx + dy * dy), sp = PA.rand(14, 34) * PA.clamp(strength / 250, 0.6, 1.8);
      S.puffs.push({ x: x + PA.rand(-6, 6), y: y + 2, vx: dx / l * sp, vy: dy / l * sp, t: 0, s: PA.rand(3, 6) });
    }
  }
  function onSunk() {
    S.phase = 'sink'; S.sinkT = 0; S.sinkFrom = [S.ball.x, S.ball.y];
    PA.sfx('plink', 0.8);
    setTimeout(function () { PA.sfx('plink2', 0.45, 1.2); }, 180);
    setTimeout(function () { PA.sfx('best', 0.4); }, 450);
    var cs = w2s(CUP_X, LIP);
    var cols = [pc('FLAG'), pc('SUN'), CREAM, pc('ACCENT_BRIGHT'), pc('SKY_MID')];
    PA.burst(cs[0], cs[1] - 10, 70, { colors: cols, shape: 'rect', angle: -Math.PI / 2, spread: 0.75, speed: 980, speedMin: 380, size: 15, gravity: 900, drag: 0.5, life: 1.8 });
    PA.burst(cs[0], cs[1] - 10, 22, { colors: [pc('SUN'), CREAM], shape: 'star', size: 12, speed: 420, gravity: 200, life: 1.1 });
    S.wonT = 0;
    if(S.hole===4)PA.win(3.0);
  }
  function onRest() {
    if(S.strokes>=3){S.lives--;S.phase=S.lives<=0?'failed':'between';return;}
    S.phase = 'aim';
    say(S.strokes === 1 ? 'so close! one more throw' : 'almost — try again');
    S.idle = 0; S.demoT = 0;
    startSolve(S.ball.x, S.ball.y);
  }
  function onOut() {
    S.phase = 'out'; S.outT = 0;
    PA.sfx('out', 0.4);
    say('out of bounds — try again');
  }

  function update(dt) {
    pumpSolve(160);
    if(!S.skullPlaced && solved() && solve.sinks.length){var ds=demoShot(),arc=flightArc(solve.x,solve.y,velForDrag(ds.drag[0],ds.drag[1]),0.025,3);S.skull=arc[Math.floor(arc.length*0.55)];S.skullPlaced=true;}

    S.titleA = PA.clamp(S.titleA + (S.everDragged ? -dt * 3 : 0), 0, 1);
    S.msgT += dt;
    for (var i = S.puffs.length - 1; i >= 0; i--) {
      var p = S.puffs[i]; p.t += dt;
      if (p.t >= 0.7) { S.puffs.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2.5 * dt; p.vy *= 1 - 2.5 * dt;
    }
    var b = S.ball;
    if (S.phase === 'fly') {
      S.acc += Math.min(dt, 0.1);
      while (S.acc >= DT && S.phase === 'fly') {
        S.acc -= DT;
        step(b);
        if(S.skull&&Math.hypot(b.x-S.skull[0],b.y-S.skull[1])<25){S.skulls++;S.skull=null;PA.pop('+1 SKULL',270,350,{size:32,color:CREAM});}
        if (b.impact > 150 && PA.t - S.lastLand > 0.12) {
          S.lastLand = PA.t;
          puff(b.x, b.y + BALL_R * 0.6, b.impact);
          PA.sfx('land', PA.clamp(0.15 + b.impact / 1400, 0.15, 0.55), PA.rand(0.9, 1.1));
        }
        if (b.state === SUNK) onSunk();
        else if (b.state === OUT) onOut();
        else if (b.state === RESTING) onRest();
      }
    } else if (S.phase === 'sink') {
      S.sinkT += dt;
      S.wonT += dt;
      S.glow = Math.max(0, 1 - Math.abs(S.wonT - 0.3) * 1.2);
      S.flagLift = PA.ease.inOutSine((S.sinkT - 0.25) / 0.5);
      if(S.sinkT>1.6&&S.hole<4)S.phase=S.hole===3?'perk':'between';
    } else if (S.phase === 'out') {
      S.outT += dt;
      S.fade = S.outT < 0.25 ? 1 - S.outT / 0.25 : PA.clamp((S.outT - 0.25) / 0.35, 0, 1);
      if (S.outT >= 0.25 && b.state !== RESTING) { S.ball = newBall(S.shotStart[0], S.shotStart[1]); }
      if (S.outT > 0.6) { S.fade=1;S.phase='aim';S.idle=0;S.demoT=0;if(S.strokes>=3){S.lives--;S.phase=S.lives<=0?'failed':'between';} }
    } else if (S.phase === 'aim' && !S.drag) {
      S.idle += dt;
    }
    tutorial(dt);
  }

  // Tutorial hand: press, pull back along a sinking throw, hold, let go.
  var DEMO_P = [340, 800];
  function demoDrag() { var d = demoShot(); return d ? d.drag : [-88, 100]; }
  function tutorial(dt) {
    if (S.phase !== 'aim' || S.drag || (S.everDragged && S.idle < 2.5)) { PA.hand = null; return; }
    S.demoT += dt;
    var k = S.demoT % 2.2, d = demoDrag();
    var u = k < 0.35 ? 0 : k < 1.25 ? PA.ease.inOutSine((k - 0.35) / 0.9) : 1;
    var x = DEMO_P[0] + d[0] * Z * u, y = DEMO_P[1] + d[1] * Z * u;
    var alpha = k < 0.2 ? k / 0.2 : k > 1.75 ? Math.max(0, 1 - (k - 1.75) / 0.3) : 1;
    PA.hand = { x: x, y: y, press: k > 0.25 && k < 1.75, scale: 1.05, alpha: alpha };
    S.demo = { u: u, d: d, a: alpha * (k < 1.75 ? 1 : 0) };
  }

  // ---------------------------------------------------------------- draw
  function drawAim(c, d, alpha, snapped) {
    // tether (screen space)
    var o = S.drag ? S.drag.o : DEMO_P, f = [o[0] + d[0] * Z, o[1] + d[1] * Z];
    c.save(); c.globalAlpha = alpha;
    c.fillStyle = pc('AIM', 0.3); c.beginPath(); c.arc(o[0], o[1], 7, 0, 6.283); c.fill();
    c.strokeStyle = pc('AIM', 0.3); c.lineWidth = 2; c.beginPath(); c.moveTo(o[0], o[1]); c.lineTo(f[0], f[1]); c.stroke();
    c.fillStyle = pc('AIM', 0.35); c.beginPath(); c.arc(f[0], f[1], 4.5, 0, 6.283); c.fill();
    var v = velForDrag(d[0], d[1]);
    if (v) {
      var arc = flightArc(S.ball.x, S.ball.y, v, 0.045);
      var power = PA.clamp(Math.sqrt(d[0] * d[0] + d[1] * d[1]) / MAX_DRAG, 0, 1);
      var col = mix(P.AIM, P.AIM_HOT, power), shown = Math.max(2, Math.ceil(arc.length * (snapped ? 0.75 : 0.45)));
      for (var i = 1; i < Math.min(shown, arc.length); i++) {
        var kk = i / shown, s = w2s(arc[i][0], arc[i][1]);
        c.fillStyle = mc(col, PA.lerp(0.95, 0.2, kk));
        c.beginPath(); c.arc(s[0], s[1], PA.lerp(4.6, 2.2, kk), 0, 6.283); c.fill();
      }
    }
    c.restore();
  }
  // The world sits a little lower than in the game (it is zoomed), so the
  // sky and mesas drop with it to keep the near mesas behind the ground.
  var SKY_DY = 52;
  function backdrop(c, v, glow) {
    c.save(); c.translate(0, SKY_DY);
    var vv = { x: v.x, y: v.y - SKY_DY, w: v.w, h: v.h };
    drawSky(c, vv, glow); drawMesas(c, vv);
    c.restore();
  }
  function draw(c, v) {
    backdrop(c, v, S.glow);
    c.save();
    c.translate(PIV.sx - PIV.wx * Z, PIV.sy - PIV.wy * Z); c.scale(Z, Z);
    drawGround(c);
    drawFlag(c);
    if(S.hole===2||S.hole===4){c.fillStyle='rgba(237,185,103,0.75)';c.fillRect(230,heightAt(255)-3,55,9);PA.text('QUICKSAND',257,heightAt(255)+25,{ctx:c,size:12,color:CREAM});}
    if(S.skull){var sx=S.skull[0],sy=S.skull[1];c.fillStyle=CREAM;c.beginPath();c.ellipse(sx,sy,10,8,0,0,Math.PI*2);c.fill();c.strokeStyle=CREAM;c.lineWidth=3;c.beginPath();c.moveTo(sx-6,sy);c.lineTo(sx-16,sy-7);c.moveTo(sx+6,sy);c.lineTo(sx+16,sy-7);c.stroke();c.fillStyle=PLUM_INK;c.fillRect(sx-5,sy-2,3,3);c.fillRect(sx+2,sy-2,3,3);}
    S.puffs.forEach(function (p) { var k = p.t / 0.7; c.fillStyle = pc('DUST', 0.42 * (1 - k) * (1 - k)); c.beginPath(); c.arc(p.x, p.y, p.s * (1 + k * 1.6), 0, 6.283); c.fill(); });
    var b = S.ball, bx = b.x, by = b.y, bk = 1;
    if (S.phase === 'sink') {
      var sk = PA.clamp(S.sinkT / 0.18, 0, 1), set = [CUP_X, LIP + CUP_DEPTH - BALL_R];
      bx = PA.lerp(S.sinkFrom[0], set[0], sk); by = PA.lerp(S.sinkFrom[1], set[1], sk); bk = 1 - 0.2 * sk;
    }
    drawWeed(c, bx, by, b.spin, bk, S.fade);
    if (S.phase === 'sink') { // cup front lip so the weed sits inside
      c.fillStyle = pc('CUP'); c.fillRect(CUP_X - CUP_W / 2, LIP + CUP_DEPTH - 4, CUP_W, 4);
    }
    c.restore();
    if (S.phase === 'aim') {
      if (S.drag && S.drag.d) drawAim(c, S.drag.snapD || S.drag.d, 1, !!S.drag.snapD);
      else if (PA.hand && S.demo && S.demo.u > 0.05) drawAim(c, [S.demo.d[0] * S.demo.u, S.demo.d[1] * S.demo.u], S.demo.a * 0.85, true);
    }
    hud(c, v);
    PA.text('LIVES '+S.lives+'   SKULLS '+S.skulls,270,v.y+118,{size:22,color:CREAM,stroke:PLUM_INK,strokeW:5});
    if(S.phase==='between'||S.phase==='failed'){
      PA.button(270,800,420,78,S.phase==='failed'?'TRY RUN AGAIN':S.hole===4?'RETRY FINAL HOLE':'NEXT HOLE',{fill:'#8c4d63',top:'#b97c88',edge:CREAM,size:30});
      if(S.phase==='failed')PA.text('OUT OF TUMBLEWEEDS',270,325,{size:36,font:PA.DISPLAY,color:CREAM,stroke:PLUM_INK,strokeW:7,maxW:500});
    }
    if(S.phase==='perk'){
      c.fillStyle='rgba(40,20,36,0.94)';PA.rr(c,25,280,490,430,22);c.fill();
      PA.text('CHOOSE A PERK',270,325,{size:37,font:PA.DISPLAY,color:CREAM,maxW:460});
      [['BURR COAT','Less bounce and roll'],['WIDE CUP','20% wider cup'],['SAND SKIPPER','Quicksand cannot hold you']].forEach(function(p,i){PA.button(270,400+i*110,430,66,p[0],{fill:'#8c4d63',top:'#b97c88',edge:CREAM,size:25});PA.text(p[1],270,445+i*110,{size:18,color:CREAM,maxW:430});});
    }
  }
  function hud(c, v) {
    var top = v.y + 36, left = v.x + 22;
    c.save(); c.font = '800 17px ' + PA.TEXT;
    PA.text('STROKES', left, top, { size: 17, font: PA.TEXT, weight: 800, color: pc('CREAM', 0.8), align: 'left', shadow: 'rgba(26,13,26,0.35)', shadowY: 1 });
    var cw = c.measureText('STROKES').width; c.restore();
    PA.text('' + S.strokes, left + cw + 26 + 8, top + 1, { size: 28, font: PA.DISPLAY, color: CREAM, shadow: 'rgba(26,13,26,0.35)', shadowY: 1.5 });
    PA.text('DESERT RUN · HOLE '+S.hole+'/4', left, top + 32, { size: 15, font: PA.TEXT, weight: 800, color: pc('CREAM', 0.55), align: 'left' });
    if (S.titleA > 0) {
      c.save(); c.globalAlpha = S.titleA;
      PA.text('TUMBLEWEED', 270, 236, { size: 78, font: PA.DISPLAY, color: CREAM, shadow: 'rgba(51,20,41,0.4)', shadowY: 5, maxW: 500 });
      PA.text('3 lives · collect skulls · choose perks', 270, 296, { size: 24, font: PA.TEXT, weight: 700, color: pc('CREAM', 0.78) });
      c.restore();
    }
    if (S.msgT < 2.6 && S.msg) {
      var ma = S.msgT < 0.3 ? S.msgT / 0.3 : S.msgT > 2.0 ? 1 - (S.msgT - 2.0) / 0.6 : 1;
      PA.text(S.msg, 270, 300, { size: 28, font: PA.TEXT, weight: 800, color: CREAM, alpha: ma, shadow: 'rgba(38,20,31,0.45)', shadowY: 2 });
    }
    if (S.phase === 'aim' && !S.drag && (!S.everDragged || S.idle > 2.5)) {
      var by = 742, pa = 0.75 + 0.25 * Math.sin(PA.t * 3);
      PA.text('drag back, let go to throw', 270, by, { size: 27, font: PA.TEXT, weight: 800, color: SAND, alpha: pa, stroke: 'rgba(40,22,32,0.55)', strokeW: 5 });
    }
    if (S.phase === 'sink') {
      var k = PA.ease.outBack(Math.min(1, S.wonT / 0.45)), one = S.strokes === 1;
      c.save(); c.translate(270, 262); c.scale(k, k); c.rotate(-0.03);
      PA.text(one ? 'HOLE IN ONE!' : 'IN THE CUP!', 0, 0, { size: 82, font: PA.DISPLAY, grad: ['#fff6e6', '#f9c79a'], stroke: '#4d2e45', strokeW: 13, shadow: 'rgba(30,14,26,0.5)', shadowY: 7, maxW: 500 });
      PA.text(one ? 'first throw. pure desert magic.' : S.strokes + ' throws · nicely done', 0, 70, { size: 26, font: PA.TEXT, weight: 800, color: CREAM, stroke: 'rgba(52,30,48,0.6)', strokeW: 6 });
      c.restore();
    }
  }

  // ---------------------------------------------------------------- input (drag anywhere, like the game)
  function down(x, y, id) {
    if(S.phase==='perk'){var choice=Math.round((y-400)/110);if(choice>=0&&choice<3&&Math.abs(y-(400+choice*110))<40)reset({hole:4,lives:S.lives,skulls:S.skulls,perk:['burr_coat','wide_cup','sand_skipper'][choice]});return;}
    if(S.phase==='between'||S.phase==='failed'){if(y>750&&y<850){if(S.phase==='failed')reset();else if(S.hole===3)S.phase='perk';else reset({hole:Math.min(4,S.hole+1),lives:S.lives,skulls:S.skulls,perk:S.perk});}return;}
    if (S.phase !== 'aim' || S.drag) return;
    S.drag = { id: id, o: [x, y], d: null, snapD: null };
    S.everDragged = true;
    PA.hand = null;
  }
  function move(x, y, id) {
    if (!S.drag || S.drag.id !== id) return;
    var d = [(x - S.drag.o[0]) / Z, (y - S.drag.o[1]) / Z];
    S.drag.d = d;
    var sn = velForDrag(d[0], d[1]) && solved() ? nearest(d, tolA(), tolL()) : null;
    S.drag.snapD = sn ? sn.drag : null;
  }
  function up(x, y, id) {
    if (!S.drag || S.drag.id !== id) return;
    move(x, y, id);
    var d = S.drag.d;
    S.drag = null; S.idle = 0; S.demoT = 0;
    if (d && velForDrag(d[0], d[1])) shoot(d);
  }

  PA.register({
    init: function(){reset();},
    inspect:function(){var ds=solved()?demoShot():null;return {phase:S.phase,hole:S.hole,lives:S.lives,skulls:S.skulls,perk:S.perk,strokes:S.strokes,drag:ds?ds.drag.slice():null,ball:[S.ball.x,S.ball.y],cup:CUP_W};},
    update: update,
    draw: draw,
    down: down, move: move, up: up,
    cancel: function (id) { if (S.drag && S.drag.id === id) S.drag = null; },
    drawEndBg: function (c, v) {
      backdrop(c, v, 0.6);
      c.save(); c.translate(PIV.sx - PIV.wx * Z, PIV.sy - PIV.wy * Z); c.scale(Z, Z); drawGround(c); drawFlag(c); c.restore();
    },
    drawEndTitle: function (c, x, y) {
      PA.text('TUMBLEWEED', x, y, { size: 74, font: PA.DISPLAY, color: CREAM, stroke: '#4d2e45', strokeW: 10, shadow: 'rgba(20,8,18,0.5)', shadowY: 6, maxW: 500 });
    },
    debug: function (stage) {
      if (stage === 'mid' || stage === 'won') {
        S.everDragged = true;
        var d = demoShot() || (pumpSolve(1e9), demoShot());
        shoot(d.drag);
        if (stage === 'won') { for (var i = 0; i < 2000 && S.phase === 'fly'; i++) update(1 / 60); }
        else for (var j = 0; j < 30; j++) update(1 / 60);
      }
    },
  });
})();

</script>
</body>
